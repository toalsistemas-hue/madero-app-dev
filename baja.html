<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Baja de Documento</title>

    <link rel="stylesheet" href="actualizar.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .campo input[readonly], .campo input:disabled{ background:#eef2f6; color:#333; cursor:not-allowed; }
        .baj-error{ width:750px; margin:16px auto 0; color:#c0392b; font-weight:600; text-align:center; min-height:20px; }
        .visor-nota{ width:750px; margin:0 auto 8px; text-align:center; color:#7b8794; font-size:13px; }

        /* Modal OK */
        .baj-modal{ display:none; position:fixed; inset:0; z-index:9999; background:rgba(15,30,50,.6); align-items:center; justify-content:center; padding:24px; }
        .baj-modal.activo{ display:flex; }
        .baj-modal-box{ background:#fff; width:min(460px,94vw); border-radius:16px; padding:34px 30px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); }
        .baj-modal-box .icono{ width:74px; height:74px; margin:0 auto 18px; border-radius:50%; background:#e7f6ee; color:#27ae60; display:flex; align-items:center; justify-content:center; font-size:38px; }
        .baj-modal-box h3{ color:#1f4e79; font-size:22px; margin-bottom:12px; }
        .baj-modal-box p{ color:#555; font-size:15px; line-height:22px; margin-bottom:24px; }
        .baj-modal-box button{ background:#27ae60; color:#fff; border:none; border-radius:10px; padding:13px 34px; font-size:16px; font-weight:600; cursor:pointer; }
    </style>
</head>

<body>

<div class="contenedor">

    <header>
        <h1>SOLICITUD DE BAJA DE DOCUMENTO</h1>
    </header>

    <div class="formulario">

        <div class="campo">
            <label>Título del Documento</label>
            <input type="text" id="baj-titulo" readonly placeholder="(documento seleccionado)">
        </div>

        <div class="campo">
            <label>Tipo de documento</label>
            <input type="text" id="baj-tipo" readonly placeholder="(tipo del documento)">
        </div>

        <div class="campo">
            <label>Solicitante</label>
            <input type="text" id="baj-solicitante" readonly placeholder="(usuario en sesión)">
        </div>

        <div class="campo">
            <label>Correo Electrónico</label>
            <input type="email" id="baj-correo" readonly placeholder="(correo del usuario)">
        </div>

        <div class="campo">
            <label>Departamento</label>
            <input type="text" id="baj-departamento" placeholder="Departamento solicitante" required>
        </div>

    </div>

    <h2>Visualización Previa del documento</h2>

    <div class="visor-nota" id="baj-visor-nota">Cargando documento…</div>
    <div class="visor">
        <iframe id="baj-visor-frame" class="pdf" src="about:blank"></iframe>
    </div>

    <div class="motivo">
        <label>Motivos de la baja</label>
        <textarea id="baj-motivo" placeholder="Describe el motivo por el que se solicita dar de baja el documento…"></textarea>
    </div>

    <div class="baj-error" id="baj-error"></div>

    <div class="botones">
        <button class="regresar" onclick="window.location.href='Sistema_Gestion_Documental.html'">
            <i class="fa-solid fa-arrow-left"></i>
            Regresar
        </button>
        <button class="siguiente" id="baj-registrar" onclick="bajRegistrar()">
            Registrar
            <i class="fa-solid fa-check"></i>
        </button>
    </div>

</div>

<!-- Modal de confirmación -->
<div class="baj-modal" id="baj-modal-ok">
    <div class="baj-modal-box">
        <div class="icono">&#10003;</div>
        <h3>Solicitud registrada</h3>
        <p>Tu solicitud de baja ha sido registrada. Podrás darle seguimiento en "Seguimiento de mis solicitudes".</p>
        <button type="button" onclick="window.location.href='Sistema_Gestion_Documental.html'">Aceptar</button>
    </div>
</div>

<script src="script.js"></script>
<script>
/* ============================================================
   SOLICITUD DE BAJA DE DOCUMENTO
   ============================================================ */
var BAJ_DOC = null;

function bajCargarDoc(){
    try{ BAJ_DOC = JSON.parse(localStorage.getItem('sgd_doc_sel')||'null'); }catch(_){ BAJ_DOC=null; }
    if(BAJ_DOC){
        document.getElementById('baj-titulo').value = BAJ_DOC.nombre||'';
        document.getElementById('baj-tipo').value   = BAJ_DOC.tipoDoc||'';
    }
}

async function bajOnAuth(){
    var u = (window.SGD.getUsuario && window.SGD.getUsuario()) || null;
    if(u){
        document.getElementById('baj-solicitante').value = u.nombre||'';
        document.getElementById('baj-correo').value = u.correo||'';
    }
    await bajCargarVisor();
}

async function bajCargarVisor(){
    var nota=document.getElementById('baj-visor-nota');
    var frame=document.getElementById('baj-visor-frame');
    var ref = BAJ_DOC ? BAJ_DOC.url : '';
    if(!ref){ if(nota) nota.textContent='Este documento aún no tiene archivo cargado.'; return; }
    if(nota) nota.textContent='Cargando documento…';
    try{
        var res = await window.SGD.obtenerBlobUrl(ref);
        if(res && res.url){
            var sep = res.url.indexOf('#')>=0?'&':'#';
            frame.src = res.url + sep + 'toolbar=0&navpanes=0&statusbar=0&view=FitH';
            if(nota) nota.style.display='none';
        } else {
            if(nota) nota.textContent='No se pudo cargar el documento (verifica permisos de lectura).';
        }
    }catch(e){
        if(nota) nota.textContent='No se pudo cargar el documento.';
    }
}

async function bajRegistrar(){
    var err=document.getElementById('baj-error'); err.textContent='';
    var val=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var departamento=val('baj-departamento');
    var motivo=val('baj-motivo');

    if(!BAJ_DOC){ err.textContent='No se identificó el documento a dar de baja. Regresa y vuelve a seleccionarlo.'; return; }
    if(!departamento){ err.textContent='Escribe el Departamento (obligatorio).'; return; }
    if(!motivo){ err.textContent='Describe los Motivos de la baja.'; return; }

    var u = (window.SGD.getUsuario && window.SGD.getUsuario()) || {};
    var descripcion = 'Motivo de baja del documento '+(BAJ_DOC.codigo||'')+' ('+(BAJ_DOC.nombre||'')+'):\n'+motivo;

    // Las solicitudes de Baja se registran directamente como "Abierta" (no llevan cita)
    var fields = {
        Title: BAJ_DOC.nombre||'',
        Tipo_Documento: BAJ_DOC.tipoDoc||'',
        Tipo_Modificacion: 'Baja',
        Solicitante: u.nombre||'',
        Correo: u.correo||'',
        Departamento: departamento,
        Descripcion: descripcion,
        Requiere_Revision: 'No',
        Estatus: 'Abierta',
        Fecha_Solicitud: new Date().toISOString()
    };
    if(window.SGD.stampAuditoria) window.SGD.stampAuditoria(fields);

    var btn=document.getElementById('baj-registrar');
    btn.disabled=true; btn.textContent='Registrando…';
    var nuevoId=null;
    try{
        if(window.SGD.embebido && window.SGD.embebido()){
            var cr=await window.SGD.sp('create',{ lista:(window.SGD.LISTA_SOLICITUDES||'SGD_Solicitudes'), fields:fields });
            nuevoId=(cr&&cr.id!==undefined)?cr.id:null;
        } else {
            try{ var pend=JSON.parse(localStorage.getItem('sgd_solicitudes_local')||'[]'); pend.push(fields); localStorage.setItem('sgd_solicitudes_local',JSON.stringify(pend)); }catch(_){}
        }
    }catch(e){
        btn.disabled=false; btn.innerHTML='Registrar <i class="fa-solid fa-check"></i>';
        err.textContent='No se pudo registrar la solicitud. Intenta de nuevo.';
        return;
    }

    if(window.SGD.bitacora) window.SGD.bitacora('Registrar solicitud de baja', 'SGD_Solicitudes', (BAJ_DOC.codigo||'')+' · '+(BAJ_DOC.nombre||''), { id:nuevoId, pantalla:'Solicitud de baja' });

    document.getElementById('baj-modal-ok').classList.add('activo');
    btn.disabled=false; btn.innerHTML='Registrar <i class="fa-solid fa-check"></i>';
}

// Arranque
window.SGD = window.SGD || {};
window.SGD._onAuth = bajOnAuth;
document.addEventListener('DOMContentLoaded', function(){ bajCargarDoc(); bajOnAuth(); });
</script>
</body>
</html>
