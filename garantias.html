<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garantías — Madero Equipos</title>
<style>
:root{
  --bg:#0a0e14; --panel:#0f1824; --card:#111c2b; --border:rgba(255,255,255,.1);
  --text:#e6edf3; --dim:#8b949e; --muted:#6e7681; --accent:#1f6feb; --accent-l:#58a6ff;
  --green:#2ea043; --green-l:#4ade80; --yellow:#d4a017; --red:#ef4444; --purple:#a855f7; --orange:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--accent-l);}
#app{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;}
.tb-brand{display:flex;flex-direction:column;flex:0 0 auto;}
.tb-brand .ttl{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.tb-brand .sub{font-size:.7rem;color:var(--dim);margin-top:1px;}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center;}
.nav-item{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;cursor:pointer;font-size:.82rem;color:var(--dim);border:1px solid transparent;background:transparent;white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
.nav-item.active{background:rgba(31,111,235,.18);border-color:rgba(88,166,255,.4);color:var(--text);font-weight:600;}
.badge{background:#fff;color:#ef4444;border-radius:20px;font-size:.62rem;font-weight:800;padding:1px 7px;margin-left:2px;line-height:1.4;}
.tb-tools{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-head{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.main-head .h-ttl{font-size:1.15rem;font-weight:800;}
.main-head .h-sub{font-size:.74rem;color:var(--dim);margin-top:2px;}
.main-body{flex:1;overflow:auto;padding:16px 20px;}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:.92rem;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent-l);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
.btn{border-radius:8px;padding:8px 12px;font-size:.82rem;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);}
.btn:hover{background:rgba(255,255,255,.1);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2a7ff0;}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px;font-size:.76rem;}
.btn-danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35);color:#fca5a5;}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px 10px;font-size:.84rem;outline:none;width:100%;}
.inp:disabled{opacity:.7;cursor:not-allowed;background:rgba(255,255,255,.03);}
select.inp{appearance:auto;}
textarea.inp{resize:vertical;min-height:56px;font-family:inherit;}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.flt .inp{width:auto;min-width:150px;padding:6px 9px;font-size:.78rem;}
.st{font-size:.64rem;border-radius:20px;padding:2px 9px;white-space:nowrap;font-weight:700;}
/* tabla */
table.gtab{width:100%;border-collapse:collapse;font-size:.82rem;}
table.gtab th,table.gtab td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
table.gtab th{color:var(--dim);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--panel);}
table.gtab tr.click{cursor:pointer;}
table.gtab tr.click:hover td{background:rgba(255,255,255,.04);}
.tbl-wrap{border:1px solid var(--border);border-radius:11px;overflow:auto;}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:860px;max-width:97vw;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-hd h3{font-size:1.08rem;}
.modal-hd .x{background:transparent;border:none;color:var(--dim);font-size:1.3rem;}
.modal-bd{padding:18px 20px;overflow:auto;}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:.74rem;color:var(--dim);margin-bottom:4px;}
.req{color:#fca5a5;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr;}}
.art-block{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.02);}
.art-block .art-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.art-block .art-hd .t{font-weight:700;color:var(--accent-l);font-size:.86rem;}
.art-x{border:none;background:transparent;color:#fca5a5;font-size:1.1rem;cursor:pointer;}
.d-field{display:flex;gap:8px;font-size:.84rem;margin-bottom:6px;flex-wrap:wrap;}
.d-field .lbl{color:var(--dim);min-width:160px;}
.d-field .val{font-weight:600;flex:1;}
.d-sec{margin-bottom:14px;}
.d-sec .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b2838;border:1px solid var(--border);border-radius:9px;padding:11px 18px;font-size:.84rem;z-index:9999;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="tb-brand"><div class="ttl">🛡️ Garantías</div><div class="sub">Folios y solicitudes de garantía</div></div>
    <nav class="tabs" id="nav-tabs">
      <button class="nav-item active" id="tab-folios" onclick="setView('folios')">📋 Folios</button>
      <button class="nav-item" id="tab-solicitudes" onclick="setView('solicitudes')">📨 Solicitudes <span class="badge" id="sol-badge" style="display:none;">0</span></button>
    </nav>
    <div class="tb-tools">
      <button class="btn btn-sm" id="btn-cfg" onclick="abrirConfig()" style="display:none;">⚙️ Configuración</button>
      <button class="btn btn-primary btn-sm" onclick="abrirNuevo()">＋ Nuevo folio</button>
      <button class="btn btn-sm" id="btn-refresh" onclick="refrescar()">🔄 Actualizar</button>
    </div>
  </div>
  <section class="main">
    <div class="main-head"><div><div class="h-ttl" id="h-ttl">Folios</div><div class="h-sub" id="h-sub"></div></div></div>
    <div class="main-body" id="body"><div class="empty"><span class="spin"></span> Cargando…</div></div>
  </section>
</div>

<!-- Modal: nuevo folio -->
<div class="modal-bg" id="m-new">
  <div class="modal">
    <div class="modal-hd"><h3 id="new-ttl">Nuevo folio de garantía</h3><button class="x" onclick="cerrar('m-new')">✕</button></div>
    <div class="modal-bd">
      <div class="grid2">
        <div class="fld"><label>Técnico quien realiza folio <span class="req">*</span></label><input class="inp" id="f-tec" disabled></div>
        <div class="fld"><label>Solicita <span class="req">*</span></label><input class="inp" id="f-solicita" placeholder="Nombre de quien solicita"></div>
      </div>
      <div class="grid3">
        <div class="fld"><label>Origen <span class="req">*</span></label><select class="inp" id="f-origen"></select></div>
        <div class="fld"><label>Sucursal <span class="req">*</span></label><select class="inp" id="f-sucursal"></select></div>
        <div class="fld"><label>Departamento <span class="req">*</span></label><input class="inp" id="f-depto"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Establo</label><input class="inp" id="f-establo"></div>
        <div class="fld"><label>Fotografías de la pieza</label><input type="file" id="f-fotos" multiple accept="image/*" style="display:block;width:100%;box-sizing:border-box;padding:7px 10px;border:1px dashed #b7c4d4;border-radius:8px;background:rgba(255,255,255,.04);font-size:.8rem;cursor:pointer;" onchange="fotosChange()"><div id="f-fotos-lista" style="font-size:.74rem;color:var(--dim);margin-top:4px;"></div></div>
      </div>
      <div class="grid3">
        <div class="fld"><label>Tipo de documento <span class="req">*</span></label><select class="inp" id="f-tipodoc"></select></div>
        <div class="fld"><label>Número de documento <span class="req">*</span></label><input class="inp" id="f-numdoc"></div>
        <div class="fld"><label>Número de cliente <span class="req">*</span></label><input class="inp" id="f-numcli" placeholder="Nº cliente" onblur="cliLookup()"></div>
      </div>
      <div class="fld"><label>Cliente</label><input class="inp" id="f-cli" placeholder="(automático según número de cliente)" disabled></div>
      <div class="grid2" id="f-enviar-row">
        <div class="fld"><label>Enviar a <span class="req">*</span></label><select class="inp" id="f-enviar" onchange="enviarChange()"><option value="">Selecciona…</option></select></div>
        <div class="fld"><label>Correo</label><input class="inp" id="f-enviar-mail" placeholder="(automático)" disabled></div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;">
        <div style="font-weight:800;font-size:.95rem;">Artículos</div>
        <button class="btn btn-sm" type="button" onclick="artAdd()">＋ Agregar artículo</button>
      </div>
      <div id="f-arts"></div>

      <div style="color:#fca5a5;font-size:.82rem;min-height:18px;margin-top:6px;" id="new-err"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="cerrar('m-new')">Cancelar</button>
      <button class="btn btn-primary" id="new-ok" onclick="crearFolio()">Crear folio</button>
    </div>
  </div>
</div>

<!-- Modal: detalle folio -->
<div class="modal-bg" id="m-det">
  <div class="modal">
    <div class="modal-hd"><div><h3 id="det-ttl">Folio</h3><div class="h-sub" id="det-sub" style="color:var(--dim);font-size:.72rem;margin-top:3px;"></div></div><button class="x" onclick="cerrar('m-det')">✕</button></div>
    <div class="modal-bd" id="det-bd"></div>
    <div class="modal-ft" id="det-ft"></div>
  </div>
</div>

<!-- Modal: acción (rechazar / subir documento) -->
<div class="modal-bg" id="m-acc">
  <div class="modal" style="width:480px;">
    <div class="modal-hd"><h3 id="acc-ttl">Acción</h3><button class="x" onclick="cerrar('m-acc')">✕</button></div>
    <div class="modal-bd">
      <div id="acc-txt-wrap" class="fld"><label id="acc-lbl">Comentario</label><textarea class="inp" id="acc-txt" rows="3"></textarea></div>
      <div id="acc-file-wrap" class="fld" style="display:none;"><label id="acc-file-lbl">Documento</label><input type="file" id="acc-file" accept="application/pdf,.pdf" multiple onchange="accFilesChange()" style="display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:1px dashed #b7c4d4;border-radius:8px;background:rgba(255,255,255,.04);font-size:.82rem;cursor:pointer;"><div id="acc-file-lista" style="font-size:.76rem;color:var(--dim);margin-top:4px;"></div></div>
      <div id="acc-note" style="color:var(--dim);font-size:.82rem;margin-bottom:6px;display:none;"></div>
      <div style="color:#fca5a5;font-size:.8rem;min-height:18px;" id="acc-err"></div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" onclick="cerrar('m-acc')">Cancelar</button><button class="btn btn-primary" id="acc-ok" onclick="accConfirmar()">Confirmar</button></div>
  </div>
</div>

<!-- Modal: configuración -->
<div class="modal-bg" id="m-cfg">
  <div class="modal" style="width:520px;">
    <div class="modal-hd"><h3>Configuración de correos</h3><button class="x" onclick="cerrar('m-cfg')">✕</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Correos — Técnicos de calidad (reciben las solicitudes; separa con ;)</label><input class="inp" id="cfg-calidad" placeholder="correo1@...; correo2@..."></div>
      <div class="fld"><label>Correo — Encargado de Mostrador</label><input class="inp" id="cfg-mostrador" placeholder="correo@..."></div>
      <div class="fld"><label>Correo — Almacén</label><input class="inp" id="cfg-almacen" placeholder="correo@..."></div>
      <div class="fld"><label>Correo — Jefe de Almacén (respaldo para cerrar)</label><input class="inp" id="cfg-almacen-jefe" placeholder="correo@..."></div>
      <div class="fld"><label>CC (separados por ;)</label><input class="inp" id="cfg-cc" placeholder="correo1@...; correo2@..."></div>
      <div style="color:var(--dim);font-size:.78rem;">Estos correos se usan para el avance de etapas (por correo) y las notificaciones de la siguiente sub-etapa.</div>
      <div style="color:#fca5a5;font-size:.8rem;min-height:18px;" id="cfg-err"></div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" onclick="cerrar('m-cfg')">Cancelar</button><button class="btn btn-primary" onclick="guardarConfig()">Guardar</button></div>
  </div>
</div>

<!-- Modal: disposición por artículo -->
<div class="modal-bg" id="m-disp">
  <div class="modal" style="width:640px;">
    <div class="modal-hd"><div><h3>Disposición de artículos</h3><div class="h-sub" id="disp-sub" style="color:var(--dim);font-size:.72rem;margin-top:3px;"></div></div><button class="x" onclick="cerrar('m-disp')">✕</button></div>
    <div class="modal-bd" id="disp-bd"></div>
    <div class="modal-ft"><div style="color:#fca5a5;font-size:.8rem;flex:1;" id="disp-err"></div><button class="btn btn-ghost" onclick="cerrar('m-disp')">Cancelar</button><button class="btn btn-primary" id="disp-ok" onclick="dispGuardar()">Enviar seleccionados por garantías</button></div>
  </div>
</div>

<!-- Modal: confirmar recepción por artículo (cierre) -->
<div class="modal-bg" id="m-cierre">
  <div class="modal" style="width:620px;">
    <div class="modal-hd"><div><h3>Confirmar recepción</h3><div class="h-sub" id="cierre-sub" style="color:var(--dim);font-size:.72rem;margin-top:3px;"></div></div><button class="x" onclick="cerrar('m-cierre')">✕</button></div>
    <div class="modal-bd" id="cierre-bd"></div>
    <div class="modal-ft"><div style="color:#fca5a5;font-size:.8rem;flex:1;" id="cierre-err"></div><button class="btn btn-ghost" onclick="cerrar('m-cierre')">Cancelar</button><button class="btn btn-primary" id="cierre-ok" onclick="cierreGuardar()">Confirmar recepción</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════ GARANTÍAS (embebida) ═══════════════ */
var L_FOLIOS='GAR_Folios', L_ARTICULOS='Articulos_Sap', L_CLIENTES='Clientes_Sap', L_CONFIG='GAR_Config';
var MODO=(function(){ try{ return (new URLSearchParams(location.search).get('modo')==='solicitar')?'solicitar':'ing'; }catch(e){ return 'ing'; } })();
var SUCURSALES=['Torreón','Aguascalientes','Querétaro','Jalisco','Delicias','Houston','Chile','Puerto Rico','Shanghái'];
var TIPODOC=['Orden de trabajo','Devolución','Factura','Orden de Fabricación','Pedido','Proyecto'];
var ORIGENES=['Local','Nacional','Extranjera'];
var EVALUACION=['Pruebas en sitio','Panel de pruebas','Visual'];
var TIPOGARANTIA=['Equipo','Departamento','Proveedor'];
var EST_COLOR={'En proceso':'#f59e0b','Abierto':'#58a6ff','Documento enviado por solicitante':'#a855f7','Aplicado por mostrador':'#a855f7','Aplicado por almacén':'#a855f7','En almacén de garantías':'#58a6ff','Nota de crédito':'#a855f7','Enviado por garantías':'#f59e0b','Atendido':'#2ea043','Cerrado':'#2ea043','Cancelado':'#ef4444','Rechazado':'#9ca3af'};

var S={ user:null, completo:false, view:'folios', folios:[], enviarUsers:[], cfg:{calidad:'',mostrador:'',almacen:'',almacenJefe:'',cc:''}, cfgId:null, filtros:{}, artDraft:[], fotoDraft:[], dispDraft:[], dispFotoDraft:[], dispDocDraft:[], accFileDraft:[], cierreDocDraft:[], _cierreComent:'', _dispComent:'', curFolio:null, _loaded:false, _everLoaded:false, _autoT:null };
var DISP_EQUIPO=['Chatarra','Reparación'], DISP_PROV=['Garantía recuperada','Garantía no recuperada'];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},2600); }
function abrir(id){ document.getElementById(id).classList.add('show'); }
function cerrar(id){ document.getElementById(id).classList.remove('show'); if(id==='m-det') S.curFolio=null; }
function _pj(s,def){ try{ var v=JSON.parse(s||''); return v==null?def:v; }catch(e){ return def; } }
function nowISO(){ return new Date().toISOString(); }
function lc(s){ return (s||'').toLowerCase(); }
function fmtD(s){ if(!s) return '—'; var d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(s){ if(!s) return '—'; var d=new Date(s); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
function hex2rgba(hex,a){ hex=hex||'#888'; var m=hex.replace('#',''); if(m.length===3) m=m[0]+m[0]+m[1]+m[1]+m[2]+m[2]; return 'rgba('+parseInt(m.substr(0,2),16)+','+parseInt(m.substr(2,2),16)+','+parseInt(m.substr(4,2),16)+','+a+')'; }

/* puente */
var _bridge={ seq:0, pend:{} };
function _parent(){ return (window.parent && window.parent!==window) ? window.parent : null; }
window.addEventListener('message', function(e){
  var d=e.data||{};
  if(d.type==='SGD_AUTH'){ onAuth(d); return; }
  if(d.type==='SP_BRIDGE_RESPONSE'){ var p=_bridge.pend[d.callId]; if(!p) return; delete _bridge.pend[d.callId]; if(d.error) p.rej(new Error(d.error)); else p.res(d.result); }
});
function spCall(op,args){
  return new Promise(function(res,rej){
    var par=_parent(); if(!par){ rej(new Error('sin_portal')); return; }
    var id='gar_'+(++_bridge.seq)+'_'+Date.now(); _bridge.pend[id]={res:res,rej:rej};
    par.postMessage({ type:'SP_BRIDGE_REQUEST', callId:id, op:op, args:args||{} }, '*');
    setTimeout(function(){ if(_bridge.pend[id]){ delete _bridge.pend[id]; rej(new Error('Tiempo de espera agotado')); } }, 25000);
  });
}
async function listGet(lista){ var r=await spCall('list',{lista:lista, queryParams:'$expand=fields&$top=5000'}); return (r&&r.value)?r.value:[]; }
async function listCreate(lista,fields){ var r=await spCall('create',{lista:lista, fields:fields}); return { id:(r&&r.id!=null)?r.id:null }; }
async function listUpdate(lista,id,fields){ return spCall('update',{lista:lista, itemId:id, fields:fields}); }
async function listDelete(lista,id){ return spCall('delete',{lista:lista, itemId:id}); }
function fileB64(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]||''); }; r.onerror=rej; r.readAsDataURL(file); }); }
async function subirArchivo(carpeta,itemId,file,prefijo){ var b64=await fileB64(file); var safe=(file.name||'archivo').replace(/[^\w.\- áéíóúÁÉÍÓÚñÑ]/g,'_'); var up=await spCall('uploadAttachment',{carpeta:carpeta,itemId:itemId,fileName:(prefijo||'')+safe,contentBase64:b64}); return (up&&up.id)?{id:up.id,nombre:(file.name||safe)}:null; }
async function verArchivo(ref,nombre){ try{ var r=await spCall('getFileBase64',{driveId:ref}); if(r&&r.base64){ var mime=r.mime||'application/octet-stream'; var bin=atob(r.base64); var ar=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)ar[i]=bin.charCodeAt(i); var blob=new Blob([ar],{type:mime}); var url=URL.createObjectURL(blob); window.open(url,'_blank'); setTimeout(function(){URL.revokeObjectURL(url);},60000); } else toast('No se pudo abrir'); }catch(e){ toast('No se pudo abrir'); } }

function boot(){
  var par=_parent();
  if(!par){ document.getElementById('body').innerHTML='<div class="empty">Esta pantalla se abre embebida desde el portal. Entra desde el módulo de Ingeniería.</div>'; return; }
  par.postMessage({ type:'GAR_READY' }, '*');
  setTimeout(function(){ if(!S.user){ par.postMessage({ type:'GAR_READY' }, '*'); } }, 1200);

async function artLookup(i){
  var a=S.artDraft[i]; if(!a) return; var num=(a.num||'').trim().toUpperCase(); a.num=num;
  if(!num){ a.desc=a.numProv=a.proveedor=a.tipoProv=''; artRender(); return; }

    var r=await spCall('list',{lista:L_ARTICULOS, queryParams:"$expand=fields&$top=1&$filter=fields/Title eq '"+num.replace(/'/g,"''")+"'"});
    var it=(r&&r.value&&r.value[0])?r.value[0].fields:null;
    if(it){ a.desc=it.Descripcion||it['Descripción']||''; a.numProv=it.NumeroProveedor||it.Num_Proveedor||''; a.proveedor=it.Proveedor||''; a.tipoProv=it.TipoProveedor||it.Tipo_Proveedor||''; }
    else { a.desc='(no encontrado)'; a.numProv=a.proveedor=a.tipoProv=''; }
  }catch(e){ a.desc='(no se pudo buscar)'; console.warn('[art]',e&&e.message); }

function numeroNuevo(prefijo){
  var y=new Date().getFullYear(), n=0, re=new RegExp('^'+prefijo+'-(\\d{4})-(\\d+)');
  S.folios.forEach(function(t){ var m=re.exec(t.folio||''); if(m&&m[1]==String(y)){ var k=parseInt(m[2],10); if(k>n)n=k; } });
  return prefijo+'-'+y+'-'+String(n+1).padStart(4,'0');
}
async function crearFolio(){
  var err=document.getElementById('new-err'); err.textContent='';
  var solicita=document.getElementById('f-solicita').value.trim();
  var sucursal=document.getElementById('f-sucursal').value;
  var depto=document.getElementById('f-depto').value.trim();
  var establo=document.getElementById('f-establo').value.trim();
  var tipodoc=document.getElementById('f-tipodoc').value;
  var numdoc=document.getElementById('f-numdoc').value.trim();
  var numcli=document.getElementById('f-numcli').value.trim();
  var cli=document.getElementById('f-cli').value.trim();
  var origen=document.getElementById('f-origen').value;
  var selEnv=document.getElementById('f-enviar'); var envCorreo=selEnv.value||''; var envNombre=(selEnv.selectedIndex>0)?(selEnv.options[selEnv.selectedIndex].getAttribute('data-nom')||''):'';
  if(!solicita){ err.textContent='Escribe quién solicita.'; return; }
  if(!origen){ err.textContent='Selecciona el origen.'; return; }
  if(!sucursal){ err.textContent='Selecciona la sucursal.'; return; }
  if(!depto){ err.textContent='Escribe el departamento.'; return; }
  if(!tipodoc){ err.textContent='Selecciona el tipo de documento.'; return; }
  if(!numdoc){ err.textContent='Escribe el número de documento.'; return; }
  if(!numcli){ err.textContent='Escribe el número de cliente.'; return; }
  if(MODO!=='solicitar' && !envCorreo){ err.textContent='Selecciona a quién enviar el folio ("Enviar a").'; return; }
  if(!S.artDraft.length){ err.textContent='Agrega al menos un artículo.'; return; }
  for(var k=0;k<S.artDraft.length;k++){ var a=S.artDraft[k], n=k+1;
    if(!(a.num||'').trim()){ err.textContent='Artículo '+n+': falta el número de artículo.'; return; }
    if(!(''+a.cantidad).trim()){ err.textContent='Artículo '+n+': falta la cantidad.'; return; }
    if(!a.evaluacion){ err.textContent='Artículo '+n+': selecciona el tipo de evaluación.'; return; }
    if(!(a.falla||'').trim()){ err.textContent='Artículo '+n+': falta la descripción de la falla.'; return; }
    if(!a.fVenta){ err.textContent='Artículo '+n+': falta la fecha de venta / instalación.'; return; }
    if(!a.fFalla){ err.textContent='Artículo '+n+': falta la fecha de falla.'; return; }
    if(!a.fReclamacion){ err.textContent='Artículo '+n+': falta la fecha de reclamación.'; return; }
    if(MODO!=='solicitar' && !a.tipoGarantia){ err.textContent='Artículo '+n+': selecciona el tipo de garantía.'; return; }
  }
  var esSolic=(MODO==='solicitar');
  var btn=document.getElementById('new-ok'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    var folio=esSolic?numeroNuevo('SOL'):numeroNuevo('GAR');
    var fields={
      Title: folio,
      GrTecnicoNombre:(esSolic?'':S.user.nombre), GrTecnicoCorreo:(esSolic?'':S.user.email),
      GrSolicita:solicita, GrSolicitaCorreo:(esSolic?S.user.email:''),
      GrUsuarioSolicitaNombre:S.user.nombre, GrUsuarioSolicitaCorreo:S.user.email,
      GrTipoOrigen:origen,
      GrSucursal:sucursal, GrDepartamento:depto, GrEstablo:establo,
      GrTipoDocumento:tipodoc, GrNumeroDocumento:numdoc,
      GrNumeroCliente:numcli, GrClienteNombre:cli,
      GrEnviarANombre:envNombre, GrEnviarACorreo:envCorreo,
      GrArticulos:JSON.stringify(S.artDraft),
      GrOrigen:(esSolic?'Solicitud':'Ingenieria'),
      GrEstatus:(esSolic?'En proceso':'Abierto'),
      GrFechaRegistro:nowISO()
    };
    var cr=await listCreate(L_FOLIOS, fields);
    var itemId=cr&&cr.id;
    // Subir fotografías
    if(itemId && S.fotoDraft.length){
      btn.textContent='Subiendo fotos…'; var refs=[];
      for(var fi=0;fi<S.fotoDraft.length;fi++){ try{ var rf=await subirArchivo('GAR_Fotos',itemId,S.fotoDraft[fi],(fi+1)+'_'); if(rf) refs.push(rf); }catch(ef){} }
      if(refs.length){ try{ await listUpdate(L_FOLIOS,itemId,{ GrFotos:JSON.stringify(refs) }); }catch(e){} }
    }
    cerrar('m-new'); await loadData(); toast(esSolic?('Solicitud enviada: '+folio):('Folio creado: '+folio));
  }catch(e){ err.textContent='No se pudo guardar. '+((e&&e.message)||''); }
  finally{ btn.disabled=false; btn.textContent=(MODO==='solicitar')?'Enviar solicitud':'Crear folio'; }
}

  // Devolución: Almacén recibe
  if(MODO!=='solicitar' && !R.esFactura && est==='Aplicado por mostrador' && (R.esAlmacen||R.esAdmin)){
    b+=bPrim("accPedir('almacen')",'📦 Enviar por almacén');

  // Devolución: Ingeniería ingresa a almacén de garantías
  if(MODO!=='solicitar' && !R.esFactura && est==='Aplicado por almacén' && R.esIng){
    b+=bPrim("accPedir('enalmacen')",'🛡️ Ingresar a almacén de garantías');

  // Disposición y envío por garantías (por artículo; mientras haya pendientes)
  var _arts=t.articulos||[];
  var hayPend=_arts.some(function(a){return (a.estadoArt||'Pendiente')==='Pendiente';});
  var hayEnv=_arts.some(function(a){return a.estadoArt==='Enviado';});
  if(MODO!=='solicitar' && R.esIng && hayPend && ((!R.esFactura && (est==='En almacén de garantías'||est==='Enviado por garantías')) || (R.esFactura && (est==='Nota de crédito'||est==='Enviado por garantías')))){
    b+=bPrim("abrirDisposicion()",'⚖️ Disposición y enviar por garantías');
  }
  // Cierre por artículo (Almacén / Jefe): mientras haya artículos enviados sin confirmar
  if(MODO!=='solicitar' && hayEnv && (R.esAlmacen||R.esAdmin)){
    b+=bPrim("abrirCierre()",'✅ Confirmar recepción');
  }
  b+='<button class="btn btn-sm btn-ghost" onclick="cerrar(\'m-det\')">Cerrar</button>';
  ft.innerHTML=b;
}
function rolGar(t){
  var me=S.user.email, c=S.cfg||{};
  var esAdmin=!!(S.user&&S.user.esAdmin);
  var esMostrador=!!me && me===lc(c.mostrador);
  var esAlmacen=!!me && (me===lc(c.almacen) || me===lc(c.almacenJefe));
  var esAsistente=!!me && (t.solicitaCorreo===me || t.enviarACorreo===me);
  var esIng=(MODO!=='solicitar') && (S.completo || esAdmin || (!esMostrador && !esAlmacen));
  return { esMostrador:esMostrador, esAlmacen:esAlmacen, esAsistente:esAsistente, esIng:esIng, esAdmin:esAdmin, esFactura:(t.tipoDoc==='Factura') };
}

function accFilesChange(){ var inp=document.getElementById('acc-file'); var n=inp.files?Array.prototype.slice.call(inp.files):[]; n.forEach(function(f){ if(/\.pdf$/i.test(f.name)) S.accFileDraft.push(f); }); try{ inp.value=''; }catch(e){} var l=document.getElementById('acc-file-lista'); if(l) l.innerHTML=S.accFileDraft.length?('📎 '+S.accFileDraft.map(function(f){return esc(f.name);}).join(', ')+' <button class="btn btn-sm btn-ghost" onclick="S.accFileDraft=[];accFilesChange();">limpiar</button>'):''; }
function accPedir(modo){
  ACC_MODE=modo; S.accFileDraft=[];
  var t=S.curFolio;
  var tw=document.getElementById('acc-txt-wrap'), fw=document.getElementById('acc-file-wrap'), nt=document.getElementById('acc-note');
  document.getElementById('acc-err').textContent=''; nt.style.display='none'; nt.textContent='';
  document.getElementById('acc-file').value=''; var l=document.getElementById('acc-file-lista'); if(l) l.innerHTML='';
  if(modo==='rechazar'){
    document.getElementById('acc-ttl').textContent='Rechazar solicitud';
    document.getElementById('acc-lbl').innerHTML='Motivo del rechazo <span class="req">*</span>';
    tw.style.display=''; fw.style.display='none'; document.getElementById('acc-txt').value='';
    document.getElementById('acc-ok').textContent='Rechazar';
    abrir('m-acc'); return;
  }
  var cfg=accCfg(t)[modo]; if(!cfg) return;
  document.getElementById('acc-ttl').textContent=cfg.ttl;
  fw.style.display=''; document.getElementById('acc-file-lbl').innerHTML=cfg.flbl+(cfg.req?' <span class="req">*</span>':' <span style="color:var(--dim);font-weight:400;">(opcional)</span>');
  if(cfg.coment){ tw.style.display=''; document.getElementById('acc-lbl').innerHTML='Comentarios <span style="color:var(--dim);font-weight:400;">(opcional)</span>'; document.getElementById('acc-txt').value=''; }
  else tw.style.display='none';
  if(cfg.note){ nt.textContent=cfg.note; nt.style.display=''; }

async function accConfirmar(){
  var t=S.curFolio; if(!t) return; var err=document.getElementById('acc-err'); err.textContent='';
  var btn=document.getElementById('acc-ok');
  if(ACC_MODE==='rechazar'){
    var txt=document.getElementById('acc-txt').value.trim(); if(!txt){ err.textContent='Escribe el motivo.'; return; }
    btn.disabled=true; btn.textContent='Guardando…';
    try{ await listUpdate(L_FOLIOS,t.id,{ GrEstatus:'Rechazado', GrComentarioRechazo:txt }); Object.assign(t,{estatus:'Rechazado',comentarioRechazo:txt}); cerrar('m-acc'); pintarDetalle(); render(); toast('Solicitud rechazada'); }
    catch(e){ err.textContent='No se pudo. '+((e&&e.message)||''); } finally{ btn.disabled=false; btn.textContent='Rechazar'; }
    return;
  }
  var cfg=accCfg(t)[ACC_MODE]; if(!cfg) return;
  var files=S.accFileDraft.slice();
  if(cfg.req && !files.length){ err.textContent='Adjunta al menos un documento PDF.'; return; }
  var coment=cfg.coment?document.getElementById('acc-txt').value.trim():'';
  btn.disabled=true; btn.textContent=files.length?'Subiendo…':'Guardando…';
  try{
    var refs=(t[cfg.k]||[]).slice();
    for(var i=0;i<files.length;i++){ try{ var rf=await subirArchivo(cfg.carpeta,t.id,files[i],cfg.pref+(i+1)+'_'); if(rf) refs.push(rf); }catch(ef){} }
    var fields={ GrEstatus:cfg.estatus };
    fields[cfg.docsField]=JSON.stringify(refs);
    if(cfg.komentField && coment) fields[cfg.komentField]=coment;
    if(cfg.fecha) fields[cfg.fecha]=nowISO();
    await listUpdate(L_FOLIOS,t.id,fields);
    var patch={ estatus:cfg.estatus }; patch[cfg.k]=refs; if(cfg.kComent && coment) patch[cfg.kComent]=coment;
    Object.assign(t,patch);
    cerrar('m-acc'); pintarDetalle(); render(); toast('Etapa actualizada: '+cfg.estatus);
  }catch(e){ err.textContent='No se pudo. '+((e&&e.message)||''); } finally{ btn.disabled=false; btn.textContent=cfg.ok; }
}
async function autorizar(){
  var t=S.curFolio; if(!t) return;
  var nuevoFolio=numeroNuevo('GAR');
  try{
    await listUpdate(L_FOLIOS,t.id,{ Title:nuevoFolio, GrEstatus:'Abierto', GrTecnicoNombre:S.user.nombre, GrTecnicoCorreo:S.user.email, GrFechaAutorizacion:nowISO() });
    Object.assign(t,{ folio:nuevoFolio, estatus:'Abierto', tecnicoNombre:S.user.nombre, tecnicoCorreo:S.user.email });

  }catch(e){ toast('No se pudo autorizar'); }
}

var ARTEST_COLOR={'Pendiente':'#f59e0b','Enviado':'#58a6ff','Confirmado':'#2ea043'};
function dispOpts(tg){ if(tg==='Proveedor') return DISP_PROV; if(tg==='Equipo'||tg==='Departamento') return DISP_EQUIPO; return []; }
function artEstado(a){ return a.estadoArt||'Pendiente'; }
function dispProvCalc(a){ var r=Number(a.cantRecuperada)||0, nr=Number(a.cantNoRecuperada)||0; if(r>0&&nr>0) return 'Garantía parcial'; if(r>0) return 'Garantía recuperada'; if(nr>0) return 'Garantía no recuperada'; return ''; }
function dispResumen(a){
  if(a.tipoGarantia==='Proveedor'){ var r=Number(a.cantRecuperada)||0, nr=Number(a.cantNoRecuperada)||0; return 'Proveedor · '+(a.disposicion||dispProvCalc(a))+' · Recuperadas: '+r+' / No recuperadas: '+nr+(a.pedimento?(' · Pedimento: '+esc(a.pedimento)):'')+(a.rma?(' · RMA: '+esc(a.rma)):''); }
  return esc(a.tipoGarantia||'')+' · '+esc(a.disposicion||'');
}
function rollupEstatus(t, arts){
  if(!arts.length) return t.estatus;
  if(arts.every(function(a){return artEstado(a)==='Confirmado';})) return 'Cerrado';
  if(arts.some(function(a){return artEstado(a)==='Enviado'||artEstado(a)==='Confirmado';})) return 'Enviado por garantías';
  return t.estatus;
}
function abrirDisposicion(){
  var t=S.curFolio; if(!t) return;

function dispRender(){

    var block='<div class="art-block">'+head
      +'<label class="chk-lbl" style="margin-bottom:6px;display:block;"><input type="checkbox" '+(a._send?'checked':'')+' onchange="S.dispDraft['+i+']._send=this.checked;dispRender();"> Enviar este artículo por garantías ahora</label>'
      +'<div class="grid2"><div class="fld"><label>Tipo de garantía <span class="req">*</span></label><select class="inp" onchange="S.dispDraft['+i+'].tipoGarantia=this.value;S.dispDraft['+i+'].disposicion=\'\';dispRender();">'+selOpts(TIPOGARANTIA,a.tipoGarantia)+'</select></div>';
    if(isProv){
      block+='<div class="fld"><label>Cantidad del artículo</label><input class="inp" value="'+esc(a.cantidad||'')+'" disabled></div></div>'
        +'<div class="grid2">'
          +'<div class="fld"><label>Piezas recuperadas</label><input class="inp" type="number" min="0" value="'+esc(a.cantRecuperada!=null?a.cantRecuperada:'')+'" oninput="S.dispDraft['+i+'].cantRecuperada=this.value;"></div>'
          +'<div class="fld"><label>Piezas no recuperadas</label><input class="inp" type="number" min="0" value="'+esc(a.cantNoRecuperada!=null?a.cantNoRecuperada:'')+'" oninput="S.dispDraft['+i+'].cantNoRecuperada=this.value;"></div>'
        +'</div>'
        +'<div class="grid2">'
          +'<div class="fld"><label>Pedimento <span style="color:var(--dim);font-weight:400;">(si aplica)</span></label><input class="inp" value="'+esc(a.pedimento||'')+'" oninput="S.dispDraft['+i+'].pedimento=this.value;"></div>'
          +'<div class="fld"><label>RMA <span style="color:var(--dim);font-weight:400;">(si aplica)</span></label><input class="inp" value="'+esc(a.rma||'')+'" oninput="S.dispDraft['+i+'].rma=this.value;"></div>'
        +'</div>';
    } else {
      var opts=dispOpts(a.tipoGarantia);
      block+='<div class="fld"><label>Disposición <span class="req">*</span></label><select class="inp" '+(opts.length?'':'disabled')+' onchange="S.dispDraft['+i+'].disposicion=this.value;dispRender();">'+selOpts(opts,a.disposicion)+'</select>'+(opts.length?'':'<div style="color:var(--dim);font-size:.72rem;margin-top:3px;">Selecciona primero el tipo de garantía.</div>')+'</div></div>';
    }
    return block+'</div>';
  }).join('');
  // Evidencia de destrucción si extranjera + alguna chatarra entre los seleccionados a enviar
  var hayChatarraSel=S.dispDraft.some(function(a){ return a._send && artEstado(a)==='Pendiente' && a.tipoGarantia!=='Proveedor' && a.disposicion==='Chatarra'; });
  if(esExtra && hayChatarraSel){
    h+='<div class="fld" style="margin-top:6px;"><label>Evidencia de destrucción (origen Extranjera + Chatarra) <span class="req">*</span></label>'
      +'<input type="file" id="disp-fotos" accept="image/*" multiple onchange="dispFotosChange()" style="display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:1px dashed #b7c4d4;border-radius:8px;background:rgba(255,255,255,.04);font-size:.82rem;cursor:pointer;">'
      +'<div id="disp-fotos-lista" style="font-size:.76rem;color:var(--dim);margin-top:4px;">'+(S.dispFotoDraft.length?('📷 '+S.dispFotoDraft.map(function(f){return esc(f.name);}).join(', ')):'')+'</div></div>';
  }
  h+='<div class="fld" style="margin-top:6px;"><label>Documentos de devolución al almacén (PDF) <span style="color:var(--dim);font-weight:400;">(opcional)</span></label>'
    +'<input type="file" id="disp-docs" accept="application/pdf,.pdf" multiple onchange="dispDocsChange()" style="display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:1px dashed #b7c4d4;border-radius:8px;background:rgba(255,255,255,.04);font-size:.82rem;cursor:pointer;">'
    +'<div id="disp-docs-lista" style="font-size:.76rem;color:var(--dim);margin-top:4px;">'+(S.dispDocDraft.length?('📎 '+S.dispDocDraft.map(function(f){return esc(f.name);}).join(', ')):'')+'</div></div>';
  h+='<div class="fld"><label>Comentarios <span style="color:var(--dim);font-weight:400;">(opcional)</span></label><textarea class="inp" id="disp-coment" rows="2" oninput="S._dispComent=this.value;">'+esc(S._dispComent||'')+'</textarea></div>';
  document.getElementById('disp-bd').innerHTML=h;
}
function dispFotosChange(){ var inp=document.getElementById('disp-fotos'); var n=inp.files?Array.prototype.slice.call(inp.files):[]; n.forEach(function(f){ S.dispFotoDraft.push(f); }); try{ inp.value=''; }catch(e){} var l=document.getElementById('disp-fotos-lista'); if(l) l.innerHTML=S.dispFotoDraft.length?('📷 '+S.dispFotoDraft.map(function(f){return esc(f.name);}).join(', ')):''; }
function dispDocsChange(){ var inp=document.getElementById('disp-docs'); var n=inp.files?Array.prototype.slice.call(inp.files):[]; n.forEach(function(f){ if(/\.pdf$/i.test(f.name)) S.dispDocDraft.push(f); }); try{ inp.value=''; }catch(e){} var l=document.getElementById('disp-docs-lista'); if(l) l.innerHTML=S.dispDocDraft.length?('📎 '+S.dispDocDraft.map(function(f){return esc(f.name);}).join(', ')):''; }
async function dispGuardar(){
  var t=S.curFolio; if(!t) return; var err=document.getElementById('disp-err'); err.textContent='';
  var sel=S.dispDraft.filter(function(a){ return a._send && artEstado(a)==='Pendiente'; });
  if(!sel.length){ err.textContent='Marca al menos un artículo para enviar por garantías.'; return; }
  for(var i=0;i<S.dispDraft.length;i++){ var a=S.dispDraft[i], n=i+1; if(!(a._send&&artEstado(a)==='Pendiente')) continue;
    if(!a.tipoGarantia){ err.textContent='Artículo '+n+': selecciona el tipo de garantía.'; return; }
    if(a.tipoGarantia==='Proveedor'){
      var r=Number(a.cantRecuperada)||0, nr=Number(a.cantNoRecuperada)||0, cant=Number(a.cantidad);
      if(r+nr<=0){ err.textContent='Artículo '+n+': captura las piezas recuperadas y/o no recuperadas.'; return; }
      if(!isNaN(cant) && cant>0 && (r+nr)!==cant){ err.textContent='Artículo '+n+': recuperadas + no recuperadas ('+(r+nr)+') debe ser igual a la cantidad ('+cant+').'; return; }
      a.disposicion=dispProvCalc(a);
    } else if(!a.disposicion){ err.textContent='Artículo '+n+': selecciona la disposición.'; return; }
  }
  var esExtra=(t.tipoOrigen==='Extranjera'), hayChatarraSel=sel.some(function(a){ return a.tipoGarantia!=='Proveedor' && a.disposicion==='Chatarra'; });
  if(esExtra && hayChatarraSel && !S.dispFotoDraft.length && !(t.fotosDestruccion||[]).length){ err.textContent='Adjunta la evidencia de destrucción (Extranjera + Chatarra).'; return; }
  var btn=document.getElementById('disp-ok'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    var refs=(t.fotosDestruccion||[]).slice();
    if(S.dispFotoDraft.length){ btn.textContent='Subiendo evidencia…'; for(var fi=0;fi<S.dispFotoDraft.length;fi++){ try{ var rf=await subirArchivo('GAR_Fotos',t.id,S.dispFotoDraft[fi],'DEST_'+(fi+1)+'_'); if(rf) refs.push(rf); }catch(ef){} } }
    var docRefs=(t.docsDisposicion||[]).slice();
    if(S.dispDocDraft.length){ btn.textContent='Subiendo documentos…'; for(var di=0;di<S.dispDocDraft.length;di++){ try{ var rd=await subirArchivo('GAR_Documentos',t.id,S.dispDocDraft[di],'DISP_'+(di+1)+'_'); if(rd) docRefs.push(rd); }catch(ed){} } }
    // Marcar enviados
    S.dispDraft.forEach(function(a){ if(a._send && artEstado(a)==='Pendiente'){ a.estadoArt='Enviado'; a.fechaEnvioArt=nowISO(); } delete a._send; });
    var nuevoEst=rollupEstatus(t, S.dispDraft);
    var dComent=(S._dispComent||'').trim();
    var fields={ GrArticulos:JSON.stringify(S.dispDraft), GrEstatus:nuevoEst, GrFechaEnvioGarantias:(t.fechaEnvioGarantias||nowISO()) };
    if(refs.length) fields.GrFotosDestruccion=JSON.stringify(refs);
    if(docRefs.length) fields.GrDocsDisposicion=JSON.stringify(docRefs);
    if(dComent) fields.GrComentarioDisposicion=dComent;
    await listUpdate(L_FOLIOS,t.id,fields);
    Object.assign(t,{ articulos:S.dispDraft.slice(), estatus:nuevoEst, fotosDestruccion:refs, docsDisposicion:docRefs, comentDisposicion:(dComent||t.comentDisposicion), fechaEnvioGarantias:(t.fechaEnvioGarantias||nowISO()) });
    cerrar('m-disp'); pintarDetalle(); render();
    var pend=S.dispDraft.filter(function(a){return artEstado(a)==='Pendiente';}).length;
    toast('Enviado por garantías'+(pend?(' · quedan '+pend+' artículo(s) por enviar'):''));
  }catch(e){ err.textContent='No se pudo guardar. '+((e&&e.message)||''); } finally{ btn.disabled=false; btn.textContent='Enviar seleccionados por garantías'; }
}

/* ---------- cierre por artículo (recepción en almacén) ---------- */
function abrirCierre(){
  var t=S.curFolio; if(!t) return;
  S.dispDraft=(t.articulos||[]).map(function(a){ var c=Object.assign({},a); c._recv=false; return c; });
  S.cierreDocDraft=[]; S._cierreComent='';
  document.getElementById('cierre-sub').textContent=t.folio+' · confirma la recepción de los artículos enviados por garantías';
  document.getElementById('cierre-err').textContent='';
  cierreRender(); abrir('m-cierre');
}
function cierreRender(){
  var h=S.dispDraft.map(function(a,i){
    var est=artEstado(a);
    var head='<div class="t" style="color:var(--accent-l);font-weight:700;margin-bottom:4px;">Artículo '+(i+1)+' — '+esc(a.num)+' <span class="st" style="font-size:.66rem;background:'+hex2rgba(ARTEST_COLOR[est],.16)+';color:'+(ARTEST_COLOR[est]||'#888')+'">'+esc(est)+'</span></div>';
    var info='<div style="font-size:.8rem;color:var(--muted);margin-bottom:4px;">'+dispResumen(a)+'</div>';
    if(est==='Enviado'){ return '<div class="art-block">'+head+info+'<label class="chk-lbl"><input type="checkbox" '+(a._recv?'checked':'')+' onchange="S.dispDraft['+i+']._recv=this.checked;"> Confirmar recepción de este artículo</label></div>'; }
    if(est==='Confirmado'){ return '<div class="art-block" style="opacity:.8;">'+head+info+'<div style="font-size:.76rem;color:var(--green-l);">✔ Recibido</div></div>'; }
    return '<div class="art-block" style="opacity:.7;">'+head+'<div style="font-size:.76rem;color:var(--dim);">Aún no enviado por garantías.</div></div>';
  }).join('');
  h+='<div class="fld" style="margin-top:6px;"><label>Evidencia de recepción (PDF) <span style="color:var(--dim);font-weight:400;">(opcional)</span></label>'
    +'<input type="file" id="cierre-docs" accept="application/pdf,.pdf" multiple onchange="cierreDocsChange()" style="display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:1px dashed #b7c4d4;border-radius:8px;background:rgba(255,255,255,.04);font-size:.82rem;cursor:pointer;">'
    +'<div id="cierre-docs-lista" style="font-size:.76rem;color:var(--dim);margin-top:4px;">'+(S.cierreDocDraft.length?('📎 '+S.cierreDocDraft.map(function(f){return esc(f.name);}).join(', ')):'')+'</div></div>';
  h+='<div class="fld"><label>Comentarios <span style="color:var(--dim);font-weight:400;">(opcional)</span></label><textarea class="inp" id="cierre-coment" rows="2" oninput="S._cierreComent=this.value;">'+esc(S._cierreComent||'')+'</textarea></div>';
  document.getElementById('cierre-bd').innerHTML=h;
}
function cierreDocsChange(){ var inp=document.getElementById('cierre-docs'); var n=inp.files?Array.prototype.slice.call(inp.files):[]; n.forEach(function(f){ if(/\.pdf$/i.test(f.name)) S.cierreDocDraft.push(f); }); try{ inp.value=''; }catch(e){} var l=document.getElementById('cierre-docs-lista'); if(l) l.innerHTML=S.cierreDocDraft.length?('📎 '+S.cierreDocDraft.map(function(f){return esc(f.name);}).join(', ')):''; }
async function cierreGuardar(){
  var t=S.curFolio; if(!t) return; var err=document.getElementById('cierre-err'); err.textContent='';
  var sel=S.dispDraft.filter(function(a){ return a._recv && artEstado(a)==='Enviado'; });
  if(!sel.length){ err.textContent='Marca al menos un artículo para confirmar su recepción.'; return; }
  var btn=document.getElementById('cierre-ok'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    var docRefs=(t.docsCierre||[]).slice();
    if(S.cierreDocDraft.length){ btn.textContent='Subiendo documentos…'; for(var di=0;di<S.cierreDocDraft.length;di++){ try{ var rd=await subirArchivo('GAR_Documentos',t.id,S.cierreDocDraft[di],'CIERRE_'+(di+1)+'_'); if(rd) docRefs.push(rd); }catch(ed){} } }
    S.dispDraft.forEach(function(a){ if(a._recv && artEstado(a)==='Enviado'){ a.estadoArt='Confirmado'; a.fechaConfArt=nowISO(); } delete a._recv; });
    var nuevoEst=rollupEstatus(t, S.dispDraft);
    var cComent=(S._cierreComent||'').trim();
    var fields={ GrArticulos:JSON.stringify(S.dispDraft), GrEstatus:nuevoEst };
    if(docRefs.length) fields.GrDocsCierre=JSON.stringify(docRefs);
    if(cComent) fields.GrComentarioCierre=cComent;
    if(nuevoEst==='Cerrado') fields.GrFechaCierre=nowISO();
    await listUpdate(L_FOLIOS,t.id,fields);
    Object.assign(t,{ articulos:S.dispDraft.slice(), estatus:nuevoEst, docsCierre:docRefs, comentCierre:(cComent||t.comentCierre), fechaCierre:(nuevoEst==='Cerrado'?nowISO():t.fechaCierre) });
    cerrar('m-cierre'); pintarDetalle(); render();
    var pend=S.dispDraft.filter(function(a){return artEstado(a)!=='Confirmado';}).length;
    toast(nuevoEst==='Cerrado'?'Folio cerrado ✅':('Recepción confirmada · quedan '+pend+' artículo(s)'));
  }catch(e){ err.textContent='No se pudo guardar. '+((e&&e.message)||''); } finally{ btn.disabled=false; btn.textContent='Confirmar recepción'; }
}

/* init */
document.addEventListener('DOMContentLoaded', boot); boot();
window.setView=setView; window.abrirNuevo=abrirNuevo; window.crearFolio=crearFolio; window.cerrar=cerrar; window.refrescar=refrescar;
window.artAdd=artAdd; window.artRender=artRender; window.artLookup=artLookup; window.cliLookup=cliLookup; window.abrirFolio=abrirFolio; window.render=render; window.enviarChange=enviarChange;
window.fotosChange=fotosChange; window.accPedir=accPedir; window.accConfirmar=accConfirmar; window.autorizar=autorizar; window.abrirConfig=abrirConfig; window.guardarConfig=guardarConfig; window.verArchivo=verArchivo;
window.abrirDisposicion=abrirDisposicion; window.dispRender=dispRender; window.dispFotosChange=dispFotosChange; window.dispGuardar=dispGuardar; window.accFilesChange=accFilesChange; window.dispDocsChange=dispDocsChange;
window.abrirCierre=abrirCierre; window.cierreRender=cierreRender; window.cierreDocsChange=cierreDocsChange; window.cierreGuardar=cierreGuardar;
</script>
</body>
