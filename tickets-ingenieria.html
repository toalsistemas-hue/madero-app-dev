<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets de Ingeniería — Madero Equipos</title>
<style>
:root{
  --bg:#0a0e14; --panel:#0f1824; --card:#111c2b; --border:rgba(255,255,255,.1);
  --text:#e6edf3; --dim:#8b949e; --muted:#6e7681; --accent:#1f6feb; --accent-l:#58a6ff;
  --green:#2ea043; --green-l:#4ade80; --yellow:#d4a017; --red:#ef4444; --purple:#a855f7; --orange:#f59e0b;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
.hide{display:none!important;}
a{color:var(--accent-l);}

/* Shell */
#app{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;}
.tb-brand{display:flex;flex-direction:column;flex:1 1 auto;}
.tb-brand .ttl{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.tb-brand .sub{font-size:.7rem;color:var(--dim);margin-top:1px;}
.tb-tools{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;}
.rolechip{font-size:.6rem;border-radius:5px;padding:2px 8px;background:rgba(88,166,255,.15);color:var(--accent-l);text-transform:uppercase;letter-spacing:.4px;}
.nav-item{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;cursor:pointer;font-size:.82rem;color:var(--dim);border:1px solid transparent;background:transparent;white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
.nav-item.active{background:rgba(31,111,235,.18);border-color:rgba(88,166,255,.4);color:var(--text);font-weight:600;}

/* Reportes */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px;}
.kpi .v{font-size:1.6rem;font-weight:800;line-height:1.1;}
.kpi .l{font-size:.72rem;color:var(--dim);margin-top:4px;}
.rep-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px;margin-bottom:16px;}
.rep-card h4{font-size:.92rem;margin-bottom:12px;}
table.rtab{width:100%;border-collapse:collapse;font-size:.8rem;}
table.rtab th,table.rtab td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);}
table.rtab th{color:var(--dim);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;}
table.rtab td.num,table.rtab th.num{text-align:right;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-head{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.main-head .h-ttl{font-size:1.15rem;font-weight:800;}
.main-head .h-sub{font-size:.74rem;color:var(--dim);margin-top:2px;}
.main-body{flex:1;overflow:auto;padding:16px 20px;}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:.92rem;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent-l);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* Controls */
.btn{border-radius:8px;padding:8px 12px;font-size:.82rem;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);}
.btn:hover{background:rgba(255,255,255,.1);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2a7ff0;}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px;font-size:.76rem;}
.btn-danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35);color:#fca5a5;}
.btn-ok{background:rgba(46,160,67,.16);border-color:rgba(46,160,67,.4);color:var(--green-l);}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px 10px;font-size:.84rem;outline:none;width:100%;}
.inp:disabled{opacity:.7;cursor:not-allowed;background:rgba(255,255,255,.03);}
select.inp{appearance:auto;}
textarea.inp{resize:vertical;min-height:70px;font-family:inherit;}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.flt .inp{width:auto;min-width:130px;padding:6px 9px;font-size:.78rem;}
.chk-lbl{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--dim);cursor:pointer;}

/* Ticket list */
.tkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;}
.tkt-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 14px;cursor:pointer;transition:border-color .15s;}
.tkt-card:hover{border-color:rgba(88,166,255,.45);}
.tkt-card .folio{font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.3px;}
.tkt-card .asunto{font-size:.92rem;font-weight:700;line-height:1.3;margin:3px 0 7px;}
.tkt-card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px;}
.tag{font-size:.64rem;border-radius:6px;padding:2px 8px;white-space:nowrap;font-weight:600;}
.st{font-size:.64rem;border-radius:20px;padding:2px 9px;white-space:nowrap;font-weight:700;}
.meta-l{font-size:.68rem;color:var(--dim);display:flex;gap:4px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(88,166,255,.12);color:var(--accent-l);border-radius:20px;padding:2px 9px;font-size:.66rem;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0;width:720px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.modal.sm{width:460px;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-hd h3{font-size:1.08rem;line-height:1.3;}
.modal-hd .x{background:transparent;border:none;color:var(--dim);font-size:1.3rem;line-height:1;}
.modal-bd{padding:18px 20px;overflow:auto;}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:.74rem;color:var(--dim);margin-bottom:4px;}
.req{color:#fca5a5;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:620px){.grid2{grid-template-columns:1fr;}}

/* Artículos */
.art-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
.art-row .art-num{flex:0 0 130px;}
.art-row .art-desc{flex:1;}
.art-row .art-x{flex:0 0 auto;border:none;background:transparent;color:#fca5a5;font-size:1.1rem;cursor:pointer;}

/* Participantes */
.part-grid{display:flex;flex-wrap:wrap;gap:8px;}
.part-chk{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:.8rem;cursor:pointer;}
.part-chk input{accent-color:var(--accent);}

/* Detalle read-only */
.d-field{display:flex;gap:8px;font-size:.84rem;margin-bottom:6px;flex-wrap:wrap;}
.d-field .lbl{color:var(--dim);min-width:150px;}
.d-field .val{font-weight:600;flex:1;}
.d-sec{margin-bottom:14px;}
.d-sec .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;}
.d-box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.84rem;line-height:1.5;white-space:pre-wrap;}
.d-art{display:flex;gap:8px;font-size:.8rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.d-art .n{flex:0 0 120px;font-weight:700;color:var(--accent-l);}
.aviso{border-radius:8px;padding:10px 12px;font-size:.82rem;margin-bottom:12px;}
.aviso.cancel{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
.aviso.cerrado{background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.3);color:var(--green-l);}

/* chips config */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chipx{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:20px;padding:3px 6px 3px 11px;font-size:.76rem;}
.chipx button{background:transparent;border:none;color:var(--dim);font-size:.9rem;line-height:1;}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b2838;border:1px solid var(--border);border-radius:9px;padding:11px 18px;font-size:.84rem;z-index:9999;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="tb-brand" style="flex:0 0 auto;">
      <div class="ttl">🛠️ Tickets de Ingeniería</div>
      <div class="sub">Soporte y seguimiento de solicitudes</div>
    </div>
    <nav class="tabs" style="display:flex;gap:6px;flex:1;flex-wrap:wrap;">
      <button class="nav-item active" id="tab-tickets" onclick="setView('tickets')">🗂️ Tickets</button>
      <button class="nav-item" id="tab-reportes" onclick="setView('reportes')">📊 Reportes</button>
    </nav>
    <div class="tb-tools">
      <button class="btn btn-sm" id="btn-cfg" onclick="abrirConfig()" style="display:none;">⚙️ Configuración</button>
      <button class="btn btn-primary btn-sm" onclick="abrirNuevo()">＋ Nuevo ticket</button>
      <button class="btn btn-sm" id="btn-refresh" onclick="refrescar()">🔄 Actualizar</button>
    </div>
  </div>

  <section class="main">
    <div class="main-head">
      <div><div class="h-ttl">Tickets</div><div class="h-sub" id="h-sub"></div></div>
    </div>
    <div class="main-body" id="body"><div class="empty"><span class="spin"></span> Cargando…</div></div>
  </section>
</div>

<!-- Modal: nuevo ticket -->
<div class="modal-bg" id="m-new">
  <div class="modal">
    <div class="modal-hd"><h3>Nuevo ticket</h3><button class="x" onclick="cerrar('m-new')">✕</button></div>
    <div class="modal-bd">
      <div class="grid2">
        <div class="fld"><label>Tipo de ticket <span class="req">*</span></label><select class="inp" id="f-tipo"><option value="">Selecciona…</option></select></div>
        <div class="fld"><label>Prioridad <span class="req">*</span></label><select class="inp" id="f-prio"><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Usuario quien realiza ticket <span class="req">*</span></label><input class="inp" id="f-usr" disabled></div>
        <div class="fld"><label>Correo <span class="req">*</span></label><input class="inp" id="f-mail" disabled></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Departamento / Cliente <span class="req">*</span></label><input class="inp" id="f-depto" placeholder="Departamento interno o cliente"></div>
        <div class="fld"><label>Solicita <span class="req">*</span></label><input class="inp" id="f-solicita" placeholder="Nombre de quien solicita"></div>
      </div>
      <div class="fld">
        <label>Número de artículo <span class="req">*</span> <span style="color:var(--muted);">(se busca la descripción en Articulos_Sap)</span></label>
        <div id="f-arts"></div>
        <button class="btn btn-sm" type="button" onclick="artAdd()" style="margin-top:4px;">＋ Agregar artículo</button>
      </div>
      <div class="fld"><label>Descripción detallada de la solicitud <span class="req">*</span></label><textarea class="inp" id="f-desc" rows="4" placeholder="Describe la solicitud"></textarea></div>
      <div class="fld">
        <label>Participantes (ingenieros)</label>
        <div class="part-grid" id="f-parts"></div>
      </div>
      <div style="color:#fca5a5;font-size:.8rem;min-height:18px;" id="new-err"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="cerrar('m-new')">Cancelar</button>
      <button class="btn btn-primary" id="new-ok" onclick="crearTicket()">Crear ticket</button>
    </div>
  </div>
</div>

<!-- Modal: detalle (solo lectura) -->
<div class="modal-bg" id="m-det">
  <div class="modal">
    <div class="modal-hd"><div><h3 id="det-ttl">Ticket</h3><div class="h-sub" id="det-folio" style="color:var(--dim);font-size:.72rem;margin-top:3px;"></div></div><button class="x" onclick="cerrar('m-det')">✕</button></div>
    <div class="modal-bd" id="det-bd"></div>
    <div class="modal-ft" id="det-ft"></div>
  </div>
</div>

<!-- Modal: acción (cancelar / cerrar) -->
<div class="modal-bg" id="m-acc">
  <div class="modal sm">
    <div class="modal-hd"><h3 id="acc-ttl">Acción</h3><button class="x" onclick="cerrar('m-acc')">✕</button></div>
    <div class="modal-bd">
      <div class="fld"><label id="acc-lbl">Comentario</label><textarea class="inp" id="acc-txt" rows="4"></textarea></div>
      <div style="color:#fca5a5;font-size:.8rem;min-height:18px;" id="acc-err"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="cerrar('m-acc')">Cancelar</button>
      <button class="btn btn-primary" id="acc-ok" onclick="accConfirmar()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal: configuración -->
<div class="modal-bg" id="m-cfg">
  <div class="modal"><div class="modal-hd"><h3>Configuración</h3><button class="x" onclick="cerrar('m-cfg')">✕</button></div>
    <div class="modal-bd" id="cfg-bd"></div>
    <div class="modal-ft"><button class="btn btn-ghost" onclick="cerrar('m-cfg')">Cerrar</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════ TICKETS DE INGENIERÍA (embebida) ═══════════════ */
var L_TICKETS='TKT_Tickets', L_TIPOS='TKT_TiposTicket', L_INGS='TKT_Ingenieros', L_ARTICULOS='Articulos_Sap';
var EST_COLOR={'Abierto':'#58a6ff','Atendido':'#2ea043','Cancelado':'#ef4444'};
var PRIO_COLOR={'Urgente':'#ef4444','Alta':'#f59e0b','Media':'#d4a017','Baja':'#8b949e'};

var S = { user:null, completo:false, view:'tickets', tickets:[], tipos:[], ingenieros:[], soloMias:false, filtros:{},
          curTicket:null, artDraft:[], accMode:'', _loaded:false, _everLoaded:false, _autoT:null };

/* utilidades */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},2600); }
function abrir(id){ document.getElementById(id).classList.add('show'); }
function cerrar(id){ document.getElementById(id).classList.remove('show'); if(id==='m-det') S.curTicket=null; }
function _pj(s,def){ try{ var v=JSON.parse(s||''); return v==null?def:v; }catch(e){ return def; } }
function nowISO(){ return new Date().toISOString(); }
function lc(s){ return (s||'').toLowerCase(); }
function fmtDT(s){ if(!s) return '—'; var d=new Date(s); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
// Tiempo de atención (registro → cierre). Si es ≥1 día muestra días; si es el mismo día, muestra horas/min.
function msAtencion(t){ if(!t.fechaCierre||!t.fechaRegistro) return null; var ms=new Date(t.fechaCierre)-new Date(t.fechaRegistro); return (isNaN(ms)||ms<0)?0:ms; }
function fmtTiempo(t){ var ms=msAtencion(t); if(ms==null) return '—'; var dias=Math.floor(ms/86400000); if(dias>=1) return dias+' día(s)'; var hrs=ms/3600000; var h=Math.floor(hrs), min=Math.round((hrs-h)*60); if(min===60){h++;min=0;} if(h<=0) return (min||0)+' min'; return h+' h'+(min?(' '+min+' min'):''); }
function horasAtencion(t){ if(t.horas!=null) return t.horas; var ms=msAtencion(t); return ms==null?0:Math.round((ms/3600000)*100)/100; }
function fmtHrsNum(h){ h=Number(h)||0; if(h<1&&h>0) return Math.round(h*60)+' min'; return (Math.round(h*10)/10)+' h'; }
function hex2rgba(hex,a){ hex=hex||'#888'; var m=hex.replace('#',''); if(m.length===3) m=m[0]+m[0]+m[1]+m[1]+m[2]+m[2]; return 'rgba('+parseInt(m.substr(0,2),16)+','+parseInt(m.substr(2,2),16)+','+parseInt(m.substr(4,2),16)+','+a+')'; }

/* puente */
var _bridge={ seq:0, pend:{} };
function _parent(){ return (window.parent && window.parent!==window) ? window.parent : null; }
window.addEventListener('message', function(e){
  var d=e.data||{};
  if(d.type==='SGD_AUTH'){ onAuth(d); return; }
  if(d.type==='SP_BRIDGE_RESPONSE'){ var p=_bridge.pend[d.callId]; if(!p) return; delete _bridge.pend[d.callId]; if(d.error) p.rej(new Error(d.error)); else p.res(d.result); }
});
function spCall(op,args){
  return new Promise(function(res,rej){
    var par=_parent(); if(!par){ rej(new Error('sin_portal')); return; }
    var id='tkt_'+(++_bridge.seq)+'_'+Date.now(); _bridge.pend[id]={res:res,rej:rej};
    par.postMessage({ type:'SP_BRIDGE_REQUEST', callId:id, op:op, args:args||{} }, '*');
    setTimeout(function(){ if(_bridge.pend[id]){ delete _bridge.pend[id]; rej(new Error('Tiempo de espera agotado')); } }, 25000);
  });
}
async function listGet(lista){ var r=await spCall('list',{lista:lista, queryParams:'$expand=fields&$top=5000'}); return (r&&r.value)?r.value:[]; }
async function listCreate(lista,fields){ var r=await spCall('create',{lista:lista, fields:fields}); return { id:(r&&r.id!=null)?r.id:null }; }
async function listUpdate(lista,id,fields){ return spCall('update',{lista:lista, itemId:id, fields:fields}); }
async function listDelete(lista,id){ return spCall('delete',{lista:lista, itemId:id}); }

function boot(){
  var par=_parent();
  if(!par){ document.getElementById('body').innerHTML='<div class="empty">Esta pantalla se abre embebida desde el portal. Entra desde el módulo de Ingeniería.</div>'; return; }
  par.postMessage({ type:'TKT_READY' }, '*');
  setTimeout(function(){ if(!S.user){ par.postMessage({ type:'TKT_READY' }, '*'); } }, 1200);
  setTimeout(function(){ if(!S.user){ par.postMessage({ type:'TKT_READY' }, '*'); } }, 3000);
}
function onAuth(d){
  var u=(d&&d.user)||{};
  if(d && d.isDemoMode){ document.getElementById('body').innerHTML='<div class="empty">No disponible en modo demo (sin sesión real de Microsoft).</div>'; return; }
  S.user={ email:lc(u.correo), nombre:u.nombre||u.correo||'Usuario', esAdmin:!!u.esAdmin };
  S.completo=(d&&d.nivel==='completo')||!!u.esAdmin;
  var bc=document.getElementById('btn-cfg'); if(bc) bc.style.display=S.completo?'inline-block':'none';
  if(!S._loaded){
    S._loaded=true;
    loadData().catch(function(e){ document.getElementById('body').innerHTML='<div class="empty" style="color:#fca5a5;">No se pudieron cargar los datos. ¿Existen las listas TKT_Tickets, TKT_TiposTicket y TKT_Ingenieros?<br><small>'+esc(e.message||e)+'</small></div>'; });
    if(!S._autoT){ S._autoT=setInterval(function(){ if(S.user && !document.querySelector('.modal-bg.show')){ loadData(true).catch(function(){}); } }, 60000); }
  }
}
async function refrescar(){ var b=document.getElementById('btn-refresh'); if(b){ b.disabled=true; b.textContent='⏳'; } try{ await loadData(); }catch(e){ toast('Error al actualizar'); } finally{ if(b){ b.disabled=false; b.textContent='🔄 Actualizar'; } } }

/* ---------- datos ---------- */
async function loadData(){
  var bb=document.getElementById('body');
  if(bb && !S._everLoaded) bb.innerHTML='<div class="empty"><span class="spin"></span> Cargando…</div>';
  try{ var tp=await listGet(L_TIPOS); S.tipos=tp.map(function(i){ return (i.fields&&i.fields.Title)||''; }).filter(Boolean).sort(); }catch(e){ S.tipos=[]; }
  try{ var ing=await listGet(L_INGS); S.ingenieros=ing.map(function(i){ var f=i.fields||{}; return { nombre:f.Title||'', correo:lc(f.Correo||'') }; }).filter(function(x){return x.nombre;}).sort(function(a,b){return a.nombre.localeCompare(b.nombre);}); }catch(e){ S.ingenieros=[]; }
  var ts=await listGet(L_TICKETS);
  S.tickets=ts.map(mapTicket);
  S._everLoaded=true;
  render();
}
function mapTicket(i){ var f=i.fields||{}; return {
  id:i.id, folio:f.Title||('#'+i.id), tipo:f.TkTipo||'', prioridad:f.TkPrioridad||'Media',

/* ---------- render lista ---------- */
function misTickets(){ return S.tickets.filter(function(t){ return t.usuarioCorreo===S.user.email; }); }
function setView(v){
  S.view=v;
  var a=document.getElementById('tab-tickets'), b=document.getElementById('tab-reportes');
  if(a) a.classList.toggle('active', v==='tickets'); if(b) b.classList.toggle('active', v==='reportes');
  render();
}
function render(){
  if(S.view==='reportes') return renderReportes();
  var body=document.getElementById('body');
  var items=S.soloMias?misTickets():S.tickets.slice();
  var f=S.filtros||{};
  items=items.filter(function(t){
    if(f.est && t.estatus!==f.est) return false;
    if(f.prio && t.prioridad!==f.prio) return false;
    if(f.tipo && t.tipo!==f.tipo) return false;
    if(f.q){ var q=lc(f.q); var blob=lc(t.folio+' '+t.tipo+' '+t.departamento+' '+t.solicita+' '+t.usuarioNombre+' '+t.descripcion+' '+(t.articulos||[]).map(function(a){return a.num+' '+a.desc;}).join(' ')); if(blob.indexOf(q)<0) return false; }
    return true;
  });
  items.sort(function(a,b){ return (new Date(b.fechaRegistro||0))-(new Date(a.fechaRegistro||0)); });
  document.getElementById('h-sub').textContent=items.length+' ticket(s)';

  var tiposOpt='<option value="">Tipo: todos</option>'+S.tipos.map(function(x){return '<option'+(f.tipo===x?' selected':'')+'>'+esc(x)+'</option>';}).join('');
  var h='<div class="flt">'
    +'<input class="inp" placeholder="🔎 Buscar folio, tipo, artículo…" value="'+esc(f.q||'')+'" oninput="S.filtros.q=this.value;render();" style="min-width:230px;">'
    +'<select class="inp" onchange="S.filtros.est=this.value;render();"><option value="">Estatus: todos</option>'+['Abierto','Atendido','Cancelado'].map(function(x){return '<option'+(f.est===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'
    +'<select class="inp" onchange="S.filtros.prio=this.value;render();"><option value="">Prioridad: todas</option>'+['Urgente','Alta','Media','Baja'].map(function(x){return '<option'+(f.prio===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'
    +'<select class="inp" onchange="S.filtros.tipo=this.value;render();">'+tiposOpt+'</select>'
    +'<label class="chk-lbl"><input type="checkbox" '+(S.soloMias?'checked':'')+' onchange="S.soloMias=this.checked;render();"> Solo mis tickets</label>'
    +'<button class="btn btn-sm btn-ghost" onclick="S.filtros={};S.soloMias=false;render();">Limpiar</button>'
  +'</div>';

  if(!items.length){ h+='<div class="empty">No hay tickets que coincidan.</div>'; body.innerHTML=h; return; }
  h+='<div class="tkt-grid">'+items.map(cardHTML).join('')+'</div>';
  body.innerHTML=h;
}
function cardHTML(t){
  var nParts=(t.participantes||[]).length, nArts=(t.articulos||[]).length;
  return '<div class="tkt-card" onclick="abrirTicket(\''+t.id+'\')">'
    +'<div class="folio">'+esc(t.folio)+' · '+fmtDT(t.fechaRegistro)+'</div>'
    +'<div class="asunto">'+esc(t.tipo||'(sin tipo)')+'</div>'
    +'<div class="row">'
      +'<span class="st" style="background:'+hex2rgba(EST_COLOR[t.estatus],.16)+';color:'+(EST_COLOR[t.estatus]||'#888')+'">'+esc(t.estatus)+'</span>'
      +'<span class="tag" style="background:'+hex2rgba(PRIO_COLOR[t.prioridad],.16)+';color:'+(PRIO_COLOR[t.prioridad]||'#888')+'">'+esc(t.prioridad)+'</span>'
    +'</div>'
    +'<div class="row"><span class="meta-l">👤 '+esc(t.usuarioNombre||'—')+'</span><span class="meta-l">🏢 '+esc(t.departamento||'—')+'</span></div>'
    +'<div class="row">'+(nArts?('<span class="meta-l">📦 '+nArts+' artículo(s)</span>'):'')+(nParts?('<span class="chip">👷 '+nParts+' participante(s)</span>'):'')+'</div>'
  +'</div>';
}

/* ---------- reportes ---------- */
function kpi(v,l){ return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function renderReportes(){
  document.getElementById('h-sub').textContent='Indicadores y reportes';
  var me=S.user.email;
  // Completo: todos. Lectura: sus tickets (creados) + donde participa.
  var all = S.completo ? S.tickets.slice()
    : S.tickets.filter(function(t){ return t.usuarioCorreo===me || (t.participantes||[]).some(function(p){return lc(p.correo)===me;}); });
  var atend=all.filter(function(t){return t.estatus==='Atendido';});
  var abiertos=all.filter(function(t){return t.estatus==='Abierto';}).length;
  var cancel=all.filter(function(t){return t.estatus==='Cancelado';}).length;
  var manoObra=atend.reduce(function(a,t){return a+horasAtencion(t);},0);
  var promAt=atend.length?(manoObra/atend.length):0;

  var h='';
  if(!S.completo) h+='<div style="color:var(--dim);font-size:.8rem;margin-bottom:12px;">Mostrando solo tus tickets y en los que participas.</div>';
  h+='<div class="kpi-row">'
    +kpi(all.length,'Tickets')+kpi(abiertos,'Abiertos')+kpi(atend.length,'Atendidos')+kpi(cancel,'Cancelados')
    +kpi(fmtHrsNum(promAt),'Tiempo prom. de atención')+kpi(fmtHrsNum(manoObra),'Mano de obra total')
  +'</div>';

  // Mano de obra por usuario (quien levanta el ticket)
  var porU={};
  all.forEach(function(t){ var k=lc(t.usuarioCorreo)||'—'; if(!S.completo && k!==me) return;
    if(!porU[k]) porU[k]={nombre:t.usuarioNombre||t.usuarioCorreo||k, tickets:0, atend:0, horas:0};
    porU[k].tickets++; if(t.estatus==='Atendido'){ porU[k].atend++; porU[k].horas+=horasAtencion(t); } });
  var arrU=Object.keys(porU).map(function(k){return porU[k];}).sort(function(a,b){return b.horas-a.horas;});
  h+='<div class="rep-card"><h4>Mano de obra por usuario</h4><table class="rtab"><tr><th>Usuario</th><th class="num">Tickets</th><th class="num">Atendidos</th><th class="num">Mano de obra</th><th class="num">Prom.</th></tr>'
    +(arrU.length?arrU.map(function(x){return '<tr><td>'+esc(x.nombre)+'</td><td class="num">'+x.tickets+'</td><td class="num">'+x.atend+'</td><td class="num">'+fmtHrsNum(x.horas)+'</td><td class="num">'+fmtHrsNum(x.atend?x.horas/x.atend:0)+'</td></tr>';}).join(''):'<tr><td colspan="5" style="color:var(--muted);">Sin datos.</td></tr>')
    +'</table></div>';

  // Participación de ingenieros
  var porP={};
  all.forEach(function(t){ (t.participantes||[]).forEach(function(p){ var k=lc(p.correo)||lc(p.nombre); if(!k) return; if(!S.completo && k!==me) return;
    if(!porP[k]) porP[k]={nombre:p.nombre||p.correo||k, part:0, horas:0};
    porP[k].part++; if(t.estatus==='Atendido') porP[k].horas+=horasAtencion(t); }); });
  var arrP=Object.keys(porP).map(function(k){return porP[k];}).sort(function(a,b){return b.horas-a.horas;});
  h+='<div class="rep-card"><h4>Participación de ingenieros</h4><table class="rtab"><tr><th>Participante</th><th class="num">Participaciones</th><th class="num">Mano de obra (atendidos)</th></tr>'
    +(arrP.length?arrP.map(function(x){return '<tr><td>'+esc(x.nombre)+'</td><td class="num">'+x.part+'</td><td class="num">'+fmtHrsNum(x.horas)+'</td></tr>';}).join(''):'<tr><td colspan="3" style="color:var(--muted);">Sin datos.</td></tr>')
    +'</table></div>';

  // Tickets por tipo (solo completo)
  if(S.completo){
    var porT={}; all.forEach(function(t){ var k=t.tipo||'(sin tipo)'; porT[k]=(porT[k]||0)+1; });
    var arrT=Object.keys(porT).map(function(k){return {l:k,v:porT[k]};}).sort(function(a,b){return b.v-a.v;});
    h+='<div class="rep-card"><h4>Tickets por tipo</h4><table class="rtab"><tr><th>Tipo</th><th class="num">Tickets</th></tr>'
      +arrT.map(function(x){return '<tr><td>'+esc(x.l)+'</td><td class="num">'+x.v+'</td></tr>';}).join('')+'</table></div>';
  }

  document.getElementById('body').innerHTML=h;
}

  document.getElementById('new-err').textContent='';
  var selT=document.getElementById('f-tipo'); selT.innerHTML='<option value="">Selecciona…</option>'+S.tipos.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');

function artRender(){
  var cont=document.getElementById('f-arts');
  cont.innerHTML=S.artDraft.map(function(a,idx){
    return '<div class="art-row">'
      +'<input class="inp art-num" maxlength="8" placeholder="ES200055" value="'+esc(a.num)+'" oninput="S.artDraft['+idx+'].num=this.value.toUpperCase();this.value=this.value.toUpperCase();" onblur="artLookup('+idx+')">'
      +'<input class="inp art-desc" placeholder="Descripción (automática)" value="'+esc(a.desc)+'" disabled>'
      +(S.artDraft.length>1?'<button class="art-x" type="button" onclick="S.artDraft.splice('+idx+',1);artRender();">✕</button>':'')
    +'</div>';
  }).join('');
}
function artAdd(){ S.artDraft.push({num:'',desc:''}); artRender(); }
async function artLookup(idx){
  var a=S.artDraft[idx]; if(!a) return; var num=(a.num||'').trim().toUpperCase(); a.num=num;
  if(!num){ a.desc=''; artRender(); return; }
  // marcar buscando
  a.desc='Buscando…'; artRender();
  try{
    var r=await spCall('list',{lista:L_ARTICULOS, queryParams:"$expand=fields&$top=1&$filter=fields/Title eq '"+num.replace(/'/g,"''")+"'"});
    var it=(r&&r.value&&r.value[0])?r.value[0].fields:null;
    a.desc = it ? (it.Descripcion||it.Descripción||'(sin descripción)') : '(no encontrado)';
  }catch(e){ a.desc='(no se pudo buscar)'; console.warn('[art]',e&&e.message); }
  artRender();
}
async function folioNuevo(){
  var y=new Date().getFullYear(), n=0;
  S.tickets.forEach(function(t){ var m=/ING-(\d{4})-(\d+)/.exec(t.folio||''); if(m&&m[1]==String(y)){ var k=parseInt(m[2],10); if(k>n)n=k; } });
  return 'ING-'+y+'-'+String(n+1).padStart(4,'0');
}
async function crearTicket(){
  var err=document.getElementById('new-err'); err.textContent='';
  var tipo=document.getElementById('f-tipo').value;
  var prio=document.getElementById('f-prio').value;
  var depto=document.getElementById('f-depto').value.trim();
  var solicita=document.getElementById('f-solicita').value.trim();
  var desc=document.getElementById('f-desc').value.trim();
  var arts=(S.artDraft||[]).filter(function(a){ return (a.num||'').trim(); }).map(function(a){ return { num:a.num.trim().toUpperCase(), desc:(a.desc||'') }; });
  var parts=[]; document.querySelectorAll('.f-part:checked').forEach(function(c){ parts.push({ nombre:c.getAttribute('data-nom'), correo:c.value }); });

  if(!tipo){ err.textContent='Selecciona el tipo de ticket.'; return; }
  if(!depto){ err.textContent='Escribe el departamento / cliente.'; return; }
  if(!solicita){ err.textContent='Escribe quién solicita.'; return; }
  if(!arts.length){ err.textContent='Agrega al menos un número de artículo.'; return; }
  if(!desc){ err.textContent='Escribe la descripción detallada.'; return; }

  var btn=document.getElementById('new-ok'); btn.disabled=true; btn.textContent='Creando…';
  try{
    var folio=await folioNuevo();
    var fields={
      Title: folio, TkTipo:tipo, TkPrioridad:prio,
      TkUsuarioNombre:S.user.nombre, TkUsuarioCorreo:S.user.email,
      TkDepartamento:depto, TkSolicita:solicita,
      TkArticulos:JSON.stringify(arts), TkDescripcion:desc,
      TkParticipantes:JSON.stringify(parts), TkEstatus:'Abierto',
      TkFechaRegistro:nowISO()
    };
    await listCreate(L_TICKETS, fields);
    cerrar('m-new'); await loadData(); toast('Ticket creado: '+folio);
  }catch(e){ err.textContent='No se pudo crear. '+((e&&e.message)||''); }
  finally{ btn.disabled=false; btn.textContent='Crear ticket'; }
}

function abrirTicket(id){ var t=S.tickets.find(function(x){return String(x.id)===String(id);}); if(!t) return; S.curTicket=t; pintarDetalle(); abrir('m-det'); }

  else if(t.estatus==='Atendido'){ h+='<div class="aviso cerrado"><b>Ticket atendido</b> · '+fmtDT(t.fechaCierre)+' · <b>Tiempo de atención:</b> '+fmtTiempo(t)+(t.comentarioCierre?('<br><b>Comentarios:</b> '+esc(t.comentarioCierre)):'')+'</div>'; }

    +'<span class="st" style="background:'+hex2rgba(EST_COLOR[t.estatus],.16)+';color:'+(EST_COLOR[t.estatus]||'#888')+'">'+esc(t.estatus)+'</span>'
    +'<span class="tag" style="background:'+hex2rgba(PRIO_COLOR[t.prioridad],.16)+';color:'+(PRIO_COLOR[t.prioridad]||'#888')+'">Prioridad '+esc(t.prioridad)+'</span>'
  +'</div></div>';

  h+='<div class="d-sec">'
    +dF('Tipo de ticket',t.tipo)
    +dF('Usuario quien realiza',t.usuarioNombre+(t.usuarioCorreo?(' · '+t.usuarioCorreo):''))
    +dF('Departamento / Cliente',t.departamento)
    +dF('Solicita',t.solicita)
  +'</div>';

  h+='<div class="d-sec"><div class="k">Artículos</div>';
  if((t.articulos||[]).length){ h+=t.articulos.map(function(a){ return '<div class="d-art"><span class="n">'+esc(a.num)+'</span><span>'+esc(a.desc||'')+'</span></div>'; }).join(''); }
  else h+='<div style="color:var(--muted);font-size:.8rem;">Sin artículos.</div>';
  h+='</div>';

  h+='<div class="d-sec"><div class="k">Descripción de la solicitud</div><div class="d-box">'+esc(t.descripcion||'—')+'</div></div>';

  h+='<div class="d-sec"><div class="k">Participantes</div>';
  if((t.participantes||[]).length){ h+='<div style="display:flex;flex-wrap:wrap;gap:6px;">'+t.participantes.map(function(p){return '<span class="chip">👷 '+esc(p.nombre||p.correo)+'</span>';}).join('')+'</div>'; }
  else h+='<div style="color:var(--muted);font-size:.8rem;">Sin participantes.</div>';
  h+='</div>';

  document.getElementById('det-bd').innerHTML=h;
  // botones: solo el creador y solo si está Abierto
  var ft=document.getElementById('det-ft'); var soyCreador=(t.usuarioCorreo===S.user.email);
  var b='';
  if(soyCreador && t.estatus==='Abierto'){
    b+='<button class="btn btn-sm btn-danger" onclick="pedirAccion(\'cancelar\')">✕ Cancelar ticket</button>';
    b+='<button class="btn btn-sm btn-ok" onclick="pedirAccion(\'cerrar\')">✔ Cerrar ticket</button>';
  }

function dF(l,v){ return '<div class="d-field"><span class="lbl">'+esc(l)+'</span><span class="val">'+esc(v||'—')+'</span></div>'; }

/* ---------- cancelar / cerrar ---------- */
function pedirAccion(modo){
  S.accMode=modo;
  document.getElementById('acc-ttl').textContent = modo==='cancelar'?'Cancelar ticket':'Cerrar ticket';
  document.getElementById('acc-lbl').innerHTML = modo==='cancelar' ? 'Motivo de la cancelación <span class="req">*</span>' : 'Comentarios (opcional)';
  document.getElementById('acc-txt').value='';
  document.getElementById('acc-err').textContent='';
  document.getElementById('acc-ok').textContent = modo==='cancelar'?'Cancelar ticket':'Cerrar ticket';
  abrir('m-acc');
}
async function accConfirmar(){
  var t=S.curTicket; if(!t) return;
  var modo=S.accMode, txt=document.getElementById('acc-txt').value.trim();
  var err=document.getElementById('acc-err'); err.textContent='';
  if(modo==='cancelar' && !txt){ err.textContent='Escribe el motivo de la cancelación.'; return; }
  var btn=document.getElementById('acc-ok'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    var cierre=nowISO();
    var ms=Math.max(0, new Date(cierre)-new Date(t.fechaRegistro||cierre));
    var dias=Math.floor(ms/86400000);
    var horas=Math.round((ms/3600000)*100)/100;   // tiempo total de atención en horas (decimal)
    var fields = (modo==='cancelar')
      ? { TkEstatus:'Cancelado', TkMotivoCancelacion:txt, TkFechaCierre:cierre, TkDias:dias, TkHoras:horas }
      : { TkEstatus:'Atendido', TkComentarioCierre:txt, TkFechaCierre:cierre, TkDias:dias, TkHoras:horas };
    await listUpdate(L_TICKETS, t.id, fields);
    Object.assign(t, { estatus:fields.TkEstatus, fechaCierre:cierre, dias:dias, horas:horas, motivoCancelacion:fields.TkMotivoCancelacion||t.motivoCancelacion, comentarioCierre:fields.TkComentarioCierre||t.comentarioCierre });
    cerrar('m-acc'); pintarDetalle(); render();
    toast(modo==='cancelar'?'Ticket cancelado':'Ticket cerrado');
  }catch(e){ err.textContent='No se pudo guardar. '+((e&&e.message)||''); }
  finally{ btn.disabled=false; btn.textContent=modo==='cancelar'?'Cancelar ticket':'Cerrar ticket'; }
}

async function cfgAddTipo(){ var v=document.getElementById('cfg-tipo').value.trim(); if(!v) return; try{ await listCreate(L_TIPOS,{Title:v}); document.getElementById('cfg-tipo').value=''; await loadData(); pintarConfig(); toast('Tipo agregado'); }catch(e){ toast('No se pudo'); } }
async function cfgDelTipo(v){ try{ var items=await listGet(L_TIPOS); var it=items.find(function(i){return (i.fields&&i.fields.Title)===v;}); if(it){ await listDelete(L_TIPOS,it.id); await loadData(); pintarConfig(); toast('Tipo eliminado'); } }catch(e){ toast('No se pudo'); } }
async function cfgAddIng(){ var n=document.getElementById('cfg-ing-nom').value.trim(), m=document.getElementById('cfg-ing-mail').value.trim(); if(!n||!m){ toast('Nombre y correo'); return; } try{ await listCreate(L_INGS,{Title:n, Correo:m}); document.getElementById('cfg-ing-nom').value=''; document.getElementById('cfg-ing-mail').value=''; await loadData(); pintarConfig(); toast('Ingeniero agregado'); }catch(e){ toast('No se pudo'); } }
async function cfgDelIng(correo){ try{ var items=await listGet(L_INGS); var it=items.find(function(i){return lc(i.fields&&i.fields.Correo)===lc(correo);}); if(it){ await listDelete(L_INGS,it.id); await loadData(); pintarConfig(); toast('Ingeniero eliminado'); } }catch(e){ toast('No se pudo'); } }

document.addEventListener('DOMContentLoaded', boot); boot();
window.abrirNuevo=abrirNuevo; window.crearTicket=crearTicket; window.cerrar=cerrar; window.refrescar=refrescar;
window.abrirTicket=abrirTicket; window.artAdd=artAdd; window.artLookup=artLookup; window.render=render; window.setView=setView;
window.pedirAccion=pedirAccion; window.accConfirmar=accConfirmar; window.abrirConfig=abrirConfig;
window.cfgAddTipo=cfgAddTipo; window.cfgDelTipo=cfgDelTipo; window.cfgAddIng=cfgAddIng; window.cfgDelIng=cfgDelIng;
</script>
