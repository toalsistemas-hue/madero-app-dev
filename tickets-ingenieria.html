<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets de Ingeniería — Madero Equipos</title>
<style>
:root{
  --bg:#0a0e14; --panel:#0f1824; --card:#111c2b; --border:rgba(255,255,255,.1);
  --text:#e6edf3; --dim:#8b949e; --muted:#6e7681; --accent:#1f6feb; --accent-l:#58a6ff;
  --green:#2ea043; --green-l:#4ade80; --yellow:#d4a017; --red:#ef4444; --purple:#a855f7; --orange:#f59e0b;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
.hide{display:none!important;}
a{color:var(--accent-l);}

/* Shell */
#app{display:flex;flex-direction:column;height:100vh;}
.shell{display:flex;flex:1;overflow:hidden;}
.sidebar{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-head{padding:16px 16px 10px;}
.sb-head .ttl{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.sb-head .sub{font-size:.72rem;color:var(--dim);margin-top:2px;}
.sb-nav{flex:1;overflow:auto;padding:8px 10px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:.86rem;color:var(--text);margin-bottom:3px;border:1px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.05);}
.nav-item.active{background:rgba(31,111,235,.18);border-color:rgba(88,166,255,.4);}
.nav-item .ico{width:20px;text-align:center;flex:0 0 auto;}
.nav-item .cnt{margin-left:auto;background:rgba(255,255,255,.1);border-radius:20px;font-size:.66rem;padding:1px 8px;color:var(--dim);}
.sb-foot{padding:10px;border-top:1px solid var(--border);}
.user-row{display:flex;align-items:center;gap:8px;padding:6px 6px 8px;font-size:.78rem;color:var(--dim);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex:0 0 auto;}
.rolechip{font-size:.6rem;border-radius:5px;padding:1px 7px;background:rgba(88,166,255,.15);color:var(--accent-l);text-transform:uppercase;letter-spacing:.4px;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.main-head .h-ttl{font-size:1.2rem;font-weight:800;}
.main-head .h-sub{font-size:.74rem;color:var(--dim);margin-top:2px;}
.main-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.main-body{flex:1;overflow:auto;padding:16px 20px;}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:.92rem;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent-l);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* Controls */
.btn{border-radius:8px;padding:8px 12px;font-size:.82rem;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);}
.btn:hover{background:rgba(255,255,255,.1);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2a7ff0;}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px;font-size:.76rem;}
.btn-danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.btn-ok{background:rgba(46,160,67,.16);border-color:rgba(46,160,67,.4);color:var(--green-l);}
.btn-block{width:100%;}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px 10px;font-size:.84rem;outline:none;width:100%;}
select.inp{appearance:auto;}
textarea.inp{resize:vertical;min-height:70px;font-family:inherit;}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.flt .inp{width:auto;min-width:130px;padding:6px 9px;font-size:.78rem;}
.flt label{font-size:.72rem;color:var(--dim);}

/* Ticket list / table */
.tkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
.tkt-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 14px;cursor:pointer;position:relative;transition:border-color .15s;}
.tkt-card:hover{border-color:rgba(88,166,255,.45);}
.tkt-card .folio{font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.3px;}
.tkt-card .asunto{font-size:.92rem;font-weight:700;line-height:1.3;margin:3px 0 7px;}
.tkt-card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px;}
.tag{font-size:.64rem;border-radius:6px;padding:2px 8px;white-space:nowrap;font-weight:600;}
.st{font-size:.64rem;border-radius:20px;padding:2px 9px;white-space:nowrap;font-weight:700;}
.meta-l{font-size:.68rem;color:var(--dim);display:flex;gap:4px;align-items:center;}
.sla-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.asg-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(88,166,255,.12);color:var(--accent-l);border-radius:20px;padding:2px 9px;font-size:.66rem;}

/* Kanban */
.kanban{display:flex;gap:12px;align-items:flex-start;min-height:100%;overflow-x:auto;padding-bottom:10px;}
.kcol{flex:0 0 268px;width:268px;background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 170px);}
.kcol-hd{padding:10px 12px;font-size:.78rem;font-weight:800;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:6px;}
.kcol-bd{padding:8px;overflow:auto;display:flex;flex-direction:column;gap:8px;}
.kcol-bd .tkt-card{padding:10px 11px;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0;width:720px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-hd h3{font-size:1.08rem;line-height:1.3;}
.modal-hd .x{background:transparent;border:none;color:var(--dim);font-size:1.3rem;line-height:1;}
.modal-bd{padding:18px 20px;overflow:auto;}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:.74rem;color:var(--dim);margin-bottom:4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr;}}

/* Detail */
.d-section{margin-bottom:16px;}
.d-section .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;}
.d-field{display:flex;gap:8px;font-size:.84rem;margin-bottom:5px;flex-wrap:wrap;}
.d-field .lbl{color:var(--dim);min-width:120px;}
.d-field .val{font-weight:600;}
.d-desc{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.84rem;line-height:1.5;white-space:pre-wrap;}
.timer-box{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 14px;flex-wrap:wrap;}
.timer-disp{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;}
.timer-disp.run{color:var(--green-l);}
.hours-badge{font-size:.78rem;color:var(--dim);}
.timeline{border-left:2px solid var(--border);padding-left:14px;margin-left:4px;}
.tl-item{position:relative;margin-bottom:13px;}
.tl-item:before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);}
.tl-item.t-tiempo:before{background:var(--orange);}
.tl-item.t-estatus:before{background:var(--purple);}
.tl-item.t-solucion:before{background:var(--green);}
.tl-head{font-size:.72rem;color:var(--dim);margin-bottom:2px;}
.tl-body{font-size:.84rem;line-height:1.45;white-space:pre-wrap;}
.tl-hrs{font-size:.7rem;color:var(--orange);font-weight:700;}

/* Reports */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px;}
.kpi .v{font-size:1.7rem;font-weight:800;line-height:1.1;}
.kpi .l{font-size:.72rem;color:var(--dim);margin-top:4px;}
.kpi .s{font-size:.68rem;color:var(--muted);margin-top:3px;}
.rep-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px;margin-bottom:16px;}
.rep-card h4{font-size:.92rem;margin-bottom:12px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.78rem;}
.bar-row .bl{flex:0 0 160px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:18px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);display:flex;align-items:center;padding-left:7px;font-size:.66rem;font-weight:700;color:#07131f;}
.bar-row .bv{flex:0 0 auto;font-weight:700;min-width:46px;text-align:right;}
table.rtab{width:100%;border-collapse:collapse;font-size:.78rem;}
table.rtab th,table.rtab td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);}
table.rtab th{color:var(--dim);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;}

/* chips list editor (config) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chipx{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:20px;padding:3px 6px 3px 11px;font-size:.76rem;}
.chipx button{background:transparent;border:none;color:var(--dim);font-size:.9rem;line-height:1;}

/* Toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b2838;border:1px solid var(--border);border-radius:9px;padding:11px 18px;font-size:.84rem;z-index:9999;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.notice{background:rgba(31,111,235,.1);border:1px solid rgba(88,166,255,.3);border-radius:9px;padding:10px 13px;font-size:.8rem;color:var(--accent-l);margin-bottom:14px;}
</style>
</head>
<body>

<div id="app">
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="ttl">🛠️ Tickets de Ingeniería</div>
        <div class="sub">Soporte y seguimiento de solicitudes</div>
      </div>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-foot">
        <button class="btn btn-primary btn-block" id="btn-nuevo" onclick="abrirNuevo()">＋ Nuevo ticket</button>
        <div class="user-row" style="margin-top:10px;">
          <div class="avatar" id="u-ava">·</div>
          <div style="flex:1;min-width:0;">
            <div id="u-nom" style="color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">—</div>
            <span class="rolechip" id="u-rol">—</span>
          </div>
        </div>
        <button class="btn btn-sm btn-block" id="btn-refresh" onclick="refrescar()" style="margin-top:6px;">🔄 Actualizar</button>
      </div>
    </aside>

    <!-- Main -->
    <section class="main">
      <div class="main-head">
        <div>
          <div class="h-ttl" id="h-ttl">Mis tickets</div>
          <div class="h-sub" id="h-sub"></div>
        </div>
        <div class="main-tools" id="h-tools"></div>
      </div>
      <div class="main-body" id="body">
        <div class="empty"><span class="spin"></span> Cargando…</div>
      </div>
    </section>
  </div>
</div>

<!-- Modal: detalle de ticket -->
<div class="modal-bg" id="m-det">
  <div class="modal" style="width:760px;">
    <div class="modal-hd">
      <div><h3 id="det-ttl">Ticket</h3><div class="h-sub" id="det-folio" style="color:var(--dim);font-size:.72rem;margin-top:3px;"></div></div>
      <button class="x" onclick="cerrar('m-det')">✕</button>
    </div>
    <div class="modal-bd" id="det-bd"></div>
    <div class="modal-ft" id="det-ft"></div>
  </div>
</div>

<!-- Modal: nuevo / editar ticket -->
<div class="modal-bg" id="m-new">
  <div class="modal">
    <div class="modal-hd"><h3 id="new-ttl">Nuevo ticket</h3><button class="x" onclick="cerrar('m-new')">✕</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Asunto *</label><input class="inp" id="f-asunto" placeholder="Describe brevemente la solicitud"></div>
      <div class="grid3">
        <div class="fld"><label>Tipo de soporte *</label><select class="inp" id="f-tipo"></select></div>
        <div class="fld"><label>Prioridad *</label><select class="inp" id="f-prioridad"><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></div>
        <div class="fld"><label>Origen *</label><select class="inp" id="f-origen"><option value="Interno">Interno (otro depto.)</option><option value="Cliente">Cliente externo</option><option value="Correo">Correo</option></select></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Solicitante</label><input class="inp" id="f-sol-nom" placeholder="Nombre del solicitante"></div>
        <div class="fld"><label>Correo del solicitante</label><input class="inp" id="f-sol-mail" placeholder="correo@..."></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Departamento / Empresa cliente</label><input class="inp" id="f-depto" placeholder="Depto. interno o nombre del cliente"></div>
        <div class="fld"><label>Equipo / Producto</label><input class="inp" id="f-equipo" placeholder="Equipo o producto relacionado"></div>
      </div>
      <div class="fld"><label>Descripción detallada *</label><textarea class="inp" id="f-desc" placeholder="Describe la solicitud, el problema o la investigación requerida"></textarea></div>
      <div class="grid2">
        <div class="fld" id="wrap-asig"><label>Asignar a (ingeniero)</label><select class="inp" id="f-asig"><option value="">— Sin asignar (bandeja) —</option></select></div>
        <div class="fld"><label>Horas estimadas</label><input class="inp" id="f-hest" type="number" min="0" step="0.5" placeholder="0"></div>
      </div>
      <div class="notice" id="new-note"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="cerrar('m-new')">Cancelar</button>
      <button class="btn btn-primary" id="new-ok" onclick="guardarNuevo()">Crear ticket</button>
    </div>
  </div>
</div>

<!-- Modal: configuración -->
<div class="modal-bg" id="m-cfg">
  <div class="modal">
    <div class="modal-hd"><h3>Configuración</h3><button class="x" onclick="cerrar('m-cfg')">✕</button></div>
    <div class="modal-bd" id="cfg-bd"></div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="cerrar('m-cfg')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarConfig()">Guardar configuración</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   TICKETS DE INGENIERÍA — pantalla embebida (padre = index.html)
   Reutiliza el puente SP_BRIDGE del portal. Listas: TKT_*
   ═══════════════════════════════════════════════════════════════ */
var L_TICKETS='TKT_Tickets', L_BITACORA='TKT_Bitacora', L_NOTIF='TKT_Notificaciones', L_CONFIG='TKT_Config';

var EST=['Nuevo','Asignado','En proceso','En espera','Resuelto','Cerrado','Cancelado'];
var EST_ABIERTO=['Nuevo','Asignado','En proceso','En espera'];
var EST_COLOR={'Nuevo':'#58a6ff','Asignado':'#a855f7','En proceso':'#f59e0b','En espera':'#8b949e','Resuelto':'#2ea043','Cerrado':'#4b5563','Cancelado':'#ef4444'};
var PRIO_COLOR={'Urgente':'#ef4444','Alta':'#f59e0b','Media':'#d4a017','Baja':'#8b949e'};
var TIPOS_DEF=['Uso de equipo/producto','Falla / Corrección','Investigación / Desarrollo','Implementación de sistema','Otro'];
var SLA_DEF={'Urgente':8,'Alta':24,'Media':48,'Baja':72};   // horas objetivo de resolución

var S = {
  user:null, nivel:'', rol:'solicitante',
  tickets:[], bitacora:[], cfg:{ ingenieros:[], coordinadores:[], directores:[], sla:Object.assign({},SLA_DEF), tipos:TIPOS_DEF.slice() },
  cfgIds:{}, view:'mis', filtros:{}, curTicket:null, _loaded:false, _everLoaded:false, _autoT:null, _timerT:null
};

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},2600); }
function abrir(id){ document.getElementById(id).classList.add('show'); }
function cerrar(id){ document.getElementById(id).classList.remove('show'); if(id==='m-det'){ S.curTicket=null; stopTimerTick(); } }
function _pj(s,def){ try{ var v=JSON.parse(s||''); return v==null?def:v; }catch(e){ return def; } }
function nowISO(){ return new Date().toISOString(); }
function lc(s){ return (s||'').toLowerCase(); }
function fmtDT(s){ if(!s) return '—'; var d=new Date(s); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
function fmtD(s){ if(!s) return '—'; var d=new Date(s); if(isNaN(d)) return '—'; return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtHoras(h){ h=Number(h)||0; if(h<1 && h>0){ return Math.round(h*60)+' min'; } return (Math.round(h*10)/10)+' h'; }
function fmtDur(ms){ if(ms<0) ms=0; var s=Math.floor(ms/1000); var hh=Math.floor(s/3600), mm=Math.floor((s%3600)/60), ss=s%60; function p(n){return (n<10?'0':'')+n;} return p(hh)+':'+p(mm)+':'+p(ss); }
function iniciales(n){ n=(n||'').trim(); if(!n) return '·'; var p=n.split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function diffH(a,b){ if(!a||!b) return null; var d=(new Date(b)-new Date(a))/36e5; return isNaN(d)?null:d; }

/* ---------- puente con el portal ---------- */
var _bridge={ seq:0, pend:{} };
function _parent(){ return (window.parent && window.parent!==window) ? window.parent : null; }
window.addEventListener('message', function(e){
  var d=e.data||{};
  if(d.type==='SGD_AUTH'){ onAuth(d); return; }
  if(d.type==='SP_BRIDGE_RESPONSE'){
    var p=_bridge.pend[d.callId]; if(!p) return; delete _bridge.pend[d.callId];
    if(d.error) p.rej(new Error(d.error)); else p.res(d.result);
  }
});
function spCall(op,args){
  return new Promise(function(res,rej){
    var par=_parent(); if(!par){ rej(new Error('sin_portal')); return; }
    var id='tkt_'+(++_bridge.seq)+'_'+Date.now();
    _bridge.pend[id]={res:res,rej:rej};
    par.postMessage({ type:'SP_BRIDGE_REQUEST', callId:id, op:op, args:args||{} }, '*');
    setTimeout(function(){ if(_bridge.pend[id]){ delete _bridge.pend[id]; rej(new Error('Tiempo de espera agotado')); } }, 25000);
  });
}
async function listGet(lista){ var r=await spCall('list',{lista:lista, queryParams:'$expand=fields&$top=5000'}); return (r&&r.value)?r.value:[]; }
async function listCreate(lista,fields){ var r=await spCall('create',{lista:lista, fields:fields}); return { id:(r&&r.id!=null)?r.id:null }; }
async function listUpdate(lista,id,fields){ return spCall('update',{lista:lista, itemId:id, fields:fields}); }

async function notif(para,asunto,cuerpoHtml,tipo,cc){
  var dest=Array.isArray(para)?para.filter(Boolean).join(';'):(para||''); if(!dest) return;
  try{ await listCreate(L_NOTIF,{ Title:asunto, TkPara:dest, TkCC:cc||'', TkCuerpo:cuerpoHtml, TkTipo:tipo||'', TkEnviado:'' }); }
  catch(e){ console.warn('[notif]', e&&e.message); }
}

function boot(){
  var par=_parent();
  if(!par){ document.getElementById('body').innerHTML='<div class="empty">Esta pantalla se abre embebida desde el portal. Entra desde el módulo de Ingeniería.</div>'; return; }
  par.postMessage({ type:'TKT_READY' }, '*');
  setTimeout(function(){ if(!S.user){ par.postMessage({ type:'TKT_READY' }, '*'); } }, 1200);

/* ---------- roles ---------- */
function inList(arr,correo){ correo=lc(correo); return (arr||[]).some(function(x){ return lc(typeof x==='string'?x:(x&&x.correo))===correo; }); }
function esIngeniero(correo){ return (S.cfg.ingenieros||[]).some(function(x){ return lc(x.correo)===lc(correo); }); }
function nombreIng(correo){ var x=(S.cfg.ingenieros||[]).find(function(y){ return lc(y.correo)===lc(correo); }); return x?x.nombre:(correo||''); }
function calcRol(){
  var c=S.user.email;
  if(S.user.esAdmin || S.nivel==='completo' || inList(S.cfg.coordinadores,c)) return 'coordinador';
  if(inList(S.cfg.directores,c)) return 'direccion';

}
function esMio(t){ return lc(t.asignado)===lc(S.user.email) || lc(t.solicitanteCorreo)===lc(S.user.email); }

/* ---------- carga de datos ---------- */
async function loadData(silent){
  var bb=document.getElementById('body');
  if(bb && !S._everLoaded) bb.innerHTML='<div class="empty"><span class="spin"></span> Cargando…</div>';
  // config
  try{
    var cf=await listGet(L_CONFIG); S.cfgIds={};
    cf.forEach(function(i){ var f=i.fields||{}; var k=f.Title||''; S.cfgIds[k]=i.id;
      if(k==='ingenieros') S.cfg.ingenieros=_pj(f.TkValor,[]);
      else if(k==='coordinadores') S.cfg.coordinadores=_pj(f.TkValor,[]);
      else if(k==='directores') S.cfg.directores=_pj(f.TkValor,[]);
      else if(k==='sla') S.cfg.sla=Object.assign({},SLA_DEF,_pj(f.TkValor,{}));
      else if(k==='tipos'){ var tp=_pj(f.TkValor,null); if(tp&&tp.length) S.cfg.tipos=tp; }
    });
  }catch(e){ console.warn('[cfg]', e&&e.message); }
  // tickets
  var ts=await listGet(L_TICKETS);
  S.tickets=ts.map(mapTicket);
  // bitácora
  try{ var bi=await listGet(L_BITACORA); S.bitacora=bi.map(mapBit); }catch(e){ S.bitacora=[]; }
  S.rol=calcRol();
  S._everLoaded=true;
  pintarUsuario(); pintarNav(); render();
}
function mapTicket(i){ var f=i.fields||{}; return {
  id:i.id, folio:f.TkFolio||('#'+i.id), asunto:f.Title||'(sin asunto)', descripcion:f.TkDescripcion||'',
  tipo:f.TkTipo||'Otro', prioridad:f.TkPrioridad||'Media', estatus:f.TkEstatus||'Nuevo', origen:f.TkOrigen||'Interno',
  solicitanteNombre:f.TkSolicitanteNombre||'', solicitanteCorreo:f.TkSolicitanteCorreo||'',
  departamento:f.TkDepartamento||'', equipo:f.TkEquipoProducto||'',
  asignado:f.TkAsignado||'', asignadoNombre:f.TkAsignadoNombre||'',
  fSolicitud:f.TkFechaSolicitud||f.Created||'', fAsignacion:f.TkFechaAsignacion||'', fPrimeraResp:f.TkFechaPrimeraResp||'',
  fResolucion:f.TkFechaResolucion||'', fCierre:f.TkFechaCierre||'', vencimiento:f.TkVencimiento||'',
  hEst:Number(f.TkHorasEstimadas)||0, hReal:Number(f.TkHorasReales)||0,
  cronoInicio:f.TkCronometroInicio||'', cronoUsuario:f.TkCronometroUsuario||'',
  solucion:f.TkSolucion||''
}; }
function mapBit(i){ var f=i.fields||{}; return {
  id:i.id, ticketID:f.TkTicketID||'', tipo:f.TkTipo||'comentario', texto:f.TkTexto||'',
  horas:Number(f.TkHoras)||0, autorNombre:f.TkAutorNombre||'', autorCorreo:f.TkAutorCorreo||'', fecha:f.TkFecha||f.Created||''
}; }

/* ---------- SLA ---------- */
function slaHoras(prio){ return Number((S.cfg.sla||{})[prio])|| SLA_DEF[prio] || 48; }
function calcVencimiento(fSol,prio){ var d=new Date(fSol||nowISO()); d.setHours(d.getHours()+slaHoras(prio)); return d.toISOString(); }
function slaEstado(t){ // 'ok' | 'riesgo' | 'vencido' | 'cumplido' | 'incumplido'
  if(t.estatus==='Cancelado') return 'na';
  var cerrado=(t.estatus==='Resuelto'||t.estatus==='Cerrado');
  if(cerrado){ var ref=t.fResolucion||t.fCierre; if(!t.vencimiento||!ref) return 'cumplido'; return (new Date(ref)<=new Date(t.vencimiento))?'cumplido':'incumplido'; }
  if(!t.vencimiento) return 'ok';
  var h=diffH(nowISO(),t.vencimiento); // horas restantes
  if(h==null) return 'ok';
  if(h<0) return 'vencido';
  if(h<=Math.max(2,slaHoras(t.prioridad)*0.2)) return 'riesgo';
  return 'ok';
}
function slaColor(e){ return e==='vencido'||e==='incumplido'?'#ef4444':(e==='riesgo'?'#f59e0b':(e==='cumplido'?'#2ea043':'#2ea043')); }
function slaTxt(t){ var e=slaEstado(t);
  if(e==='na') return 'Cancelado';
  if(e==='cumplido') return 'SLA cumplido';
  if(e==='incumplido') return 'SLA incumplido';
  if(e==='vencido'){ var h=Math.abs(diffH(t.vencimiento,nowISO())||0); return 'Vencido ('+Math.round(h)+' h)'; }
  var r=diffH(nowISO(),t.vencimiento); return r!=null?('Vence en '+Math.round(r)+' h'):'Sin SLA';
}

function bandeja(){ return S.tickets.filter(function(t){ return !t.asignado && t.estatus!=='Cancelado' && t.estatus!=='Cerrado'; }); }

function selFiltro(key,lbl,opts,val){
  var o='<option value="">'+lbl+': todos</option>';

}
function aplicarFiltros(items){
  var f=S.filtros||{};
  return items.filter(function(t){
    if(f.est && t.estatus!==f.est) return false;
    if(f.prio && t.prioridad!==f.prio) return false;
    if(f.tipo && t.tipo!==f.tipo) return false;
    if(f.origen && t.origen!==f.origen) return false;
    if(f.ing){ var nm=t.asignadoNombre||nombreIng(t.asignado); if((nm||'')!==f.ing) return false; }
    if(f.q){ var q=lc(f.q); var blob=lc(t.folio+' '+t.asunto+' '+t.solicitanteNombre+' '+t.departamento+' '+t.equipo+' '+t.descripcion); if(blob.indexOf(q)<0) return false; }
    return true;
  });
}

function hex2rgba(hex,a){ hex=hex||'#888'; var m=hex.replace('#',''); if(m.length===3) m=m[0]+m[0]+m[1]+m[1]+m[2]+m[2]; var r=parseInt(m.substr(0,2),16),g=parseInt(m.substr(2,2),16),b=parseInt(m.substr(4,2),16); return 'rgba('+r+','+g+','+b+','+a+')'; }

function renderLista(body, items, vacio){

    h+='<select class="inp" id="det-est" style="width:auto;padding:6px 9px;font-size:.78rem;" onchange="cambiarEstatus(this.value)">';
    h+='<option value="">Cambiar estatus…</option>';
    ['En proceso','En espera','Resuelto','Cerrado','Cancelado'].forEach(function(e){ if(e!==t.estatus) h+='<option value="'+e+'">'+e+'</option>'; });
    h+='</select>';
  }
  if((t.estatus==='Resuelto') && (esMio(t)||esGestor())){
    h+='<button class="btn btn-sm" onclick="reabrir()">↩ Reabrir</button>';
    h+='<button class="btn btn-sm btn-ok" onclick="cerrarTicket()">✔ Cerrar (conforme)</button>';
  }
  if(esGestor()){ h+='<button class="btn btn-sm btn-ghost" onclick="editarTicket()">✎ Editar</button>'; }
  h+='<button class="btn btn-sm btn-ghost" onclick="cerrar(\'m-det\')">Cerrar</button>';
  ft.innerHTML=h;
}

/* ---------- cronómetro ---------- */
function startTimerTick(){ stopTimerTick(); S._timerT=setInterval(function(){ var t=S.curTicket; if(!t||!t.cronoInicio){ stopTimerTick(); return; } var d=document.getElementById('timer-disp'); if(d) d.textContent=fmtDur(new Date()-new Date(t.cronoInicio)); },1000); }
function stopTimerTick(){ if(S._timerT){ clearInterval(S._timerT); S._timerT=null; } }
async function iniciarCrono(){
  var t=S.curTicket; if(!t) return;
  var campos={ TkCronometroInicio:nowISO(), TkCronometroUsuario:S.user.email };
  // si estaba Nuevo/Asignado y lo empieza a trabajar, pásalo a En proceso
  if(t.estatus==='Nuevo'||t.estatus==='Asignado'){ campos.TkEstatus='En proceso'; if(!t.fPrimeraResp) campos.TkFechaPrimeraResp=nowISO(); }
  if(!t.asignado && (S.rol==='ingeniero'||esGestor())){ campos.TkAsignado=S.user.email; campos.TkAsignadoNombre=S.user.nombre; campos.TkFechaAsignacion=nowISO(); }
  try{ await listUpdate(L_TICKETS,t.id,campos); Object.assign(t,{cronoInicio:campos.TkCronometroInicio,cronoUsuario:S.user.email}); if(campos.TkEstatus)t.estatus=campos.TkEstatus; if(campos.TkAsignado){t.asignado=campos.TkAsignado;t.asignadoNombre=campos.TkAsignadoNombre;} if(campos.TkFechaPrimeraResp)t.fPrimeraResp=campos.TkFechaPrimeraResp;
    pintarDetalle(); toast('Cronómetro iniciado'); }
  catch(e){ toast('No se pudo iniciar'); }
}
async function detenerCrono(){
  var t=S.curTicket; if(!t||!t.cronoInicio) return;
  var horas=(new Date()-new Date(t.cronoInicio))/36e5; if(horas<0) horas=0;
  horas=Math.round(horas*100)/100;
  var nuevoTotal=Math.round((t.hReal+horas)*100)/100;
  try{
    await listUpdate(L_TICKETS,t.id,{ TkCronometroInicio:'', TkCronometroUsuario:'', TkHorasReales:nuevoTotal });
    await listCreate(L_BITACORA,{ Title:'Tiempo registrado', TkTicketID:String(t.id), TkTipo:'tiempo', TkTexto:'Sesión de trabajo con cronómetro', TkHoras:horas, TkAutorNombre:S.user.nombre, TkAutorCorreo:S.user.email, TkFecha:nowISO() });
    t.cronoInicio=''; t.cronoUsuario=''; t.hReal=nuevoTotal;
    await recargarBitacora(); pintarDetalle(); toast('Registrado: '+fmtHoras(horas));
  }catch(e){ toast('No se pudo registrar'); }
}
async function registrarHorasManual(){
  var t=S.curTicket; if(!t) return;
  var v=prompt('¿Cuántas horas registrar en este ticket? (ej. 1.5)'); if(v==null) return;
  var horas=parseFloat(String(v).replace(',','.')); if(isNaN(horas)||horas<=0){ toast('Valor no válido'); return; }
  horas=Math.round(horas*100)/100;
  var nota=prompt('Nota del trabajo realizado (opcional):')||'';
  var nuevoTotal=Math.round((t.hReal+horas)*100)/100;
  try{
    var campos={ TkHorasReales:nuevoTotal };
    if((t.estatus==='Nuevo'||t.estatus==='Asignado')){ campos.TkEstatus='En proceso'; if(!t.fPrimeraResp) campos.TkFechaPrimeraResp=nowISO(); }
    if(!t.asignado && (S.rol==='ingeniero'||esGestor())){ campos.TkAsignado=S.user.email; campos.TkAsignadoNombre=S.user.nombre; campos.TkFechaAsignacion=nowISO(); }
    await listUpdate(L_TICKETS,t.id,campos);
    await listCreate(L_BITACORA,{ Title:'Horas registradas', TkTicketID:String(t.id), TkTipo:'tiempo', TkTexto:nota||'Registro manual de horas', TkHoras:horas, TkAutorNombre:S.user.nombre, TkAutorCorreo:S.user.email, TkFecha:nowISO() });
    Object.assign(t,{hReal:nuevoTotal}); if(campos.TkEstatus)t.estatus=campos.TkEstatus; if(campos.TkAsignado){t.asignado=campos.TkAsignado;t.asignadoNombre=campos.TkAsignadoNombre;} if(campos.TkFechaPrimeraResp)t.fPrimeraResp=campos.TkFechaPrimeraResp;
    await recargarBitacora(); pintarDetalle(); toast('Registrado: '+fmtHoras(horas));
  }catch(e){ toast('No se pudo registrar'); }
}

    toast('Reasignado a '+ing.nombre);
  }catch(e){ toast('No se pudo'); }

async function cambiarEstatus(nuevo){
  var t=S.curTicket; if(!t||!nuevo) return;
  var campos={ TkEstatus:nuevo };
  var hoy=nowISO();
  if(!t.fPrimeraResp && (nuevo==='En proceso')) campos.TkFechaPrimeraResp=hoy;
  if(nuevo==='Resuelto'){
    var sol=prompt('Describe brevemente la solución aplicada:'); if(sol==null){ pintarDetalle(); return; }
    campos.TkSolucion=sol; campos.TkFechaResolucion=hoy; if(!t.fPrimeraResp) campos.TkFechaPrimeraResp=hoy;
    if(t.cronoInicio){ await detenerCronoSilencioso(); }
  }
  if(nuevo==='Cerrado') campos.TkFechaCierre=hoy;
  try{
    await listUpdate(L_TICKETS,t.id,campos);
    Object.assign(t,{estatus:nuevo}); if(campos.TkSolucion)t.solucion=campos.TkSolucion; if(campos.TkFechaResolucion)t.fResolucion=campos.TkFechaResolucion; if(campos.TkFechaCierre)t.fCierre=campos.TkFechaCierre; if(campos.TkFechaPrimeraResp)t.fPrimeraResp=campos.TkFechaPrimeraResp;
    await listCreate(L_BITACORA,{ Title:'Cambio de estatus', TkTicketID:String(t.id), TkTipo:(nuevo==='Resuelto'?'solucion':'estatus'), TkTexto:'Estatus → '+nuevo+(campos.TkSolucion?('\nSolución: '+campos.TkSolucion):''), TkHoras:0, TkAutorNombre:S.user.nombre, TkAutorCorreo:S.user.email, TkFecha:hoy });
    await recargarBitacora(); pintarDetalle(); pintarNav();
    if(nuevo==='Resuelto'){ notif(t.solicitanteCorreo, '['+t.folio+'] Tu solicitud fue resuelta', 'El ticket <b>'+esc(t.folio)+'</b> ("'+esc(t.asunto)+'") fue marcado como <b>Resuelto</b>.<br>Solución: '+esc(campos.TkSolucion||'')+'<br><br>Si estás conforme, podrás cerrarlo; si no, puede reabrirse.', 'resuelto'); }
    toast('Estatus actualizado');
  }catch(e){ toast('No se pudo'); }
}
async function detenerCronoSilencioso(){
  var t=S.curTicket; if(!t||!t.cronoInicio) return;
  var horas=Math.round(((new Date()-new Date(t.cronoInicio))/36e5)*100)/100; if(horas<0)horas=0;
  var nuevoTotal=Math.round((t.hReal+horas)*100)/100;
  try{ await listUpdate(L_TICKETS,t.id,{ TkCronometroInicio:'', TkCronometroUsuario:'', TkHorasReales:nuevoTotal });

    t.cronoInicio='';t.cronoUsuario='';t.hReal=nuevoTotal; }catch(e){}
}

async function folioNuevo(){
  var y=new Date().getFullYear();
  var n=0; S.tickets.forEach(function(t){ var m=/ING-(\d{4})-(\d+)/.exec(t.folio||''); if(m && m[1]==String(y)){ var k=parseInt(m[2],10); if(k>n)n=k; } });
  return 'ING-'+y+'-'+String(n+1).padStart(4,'0');
}
async function guardarNuevo(){
  var asunto=document.getElementById('f-asunto').value.trim();
  var desc=document.getElementById('f-desc').value.trim();
  if(!asunto){ toast('Escribe el asunto'); return; }
  if(!desc){ toast('Escribe la descripción'); return; }
  var tipo=document.getElementById('f-tipo').value, prio=document.getElementById('f-prioridad').value, origen=document.getElementById('f-origen').value;
  var solNom=document.getElementById('f-sol-nom').value.trim(), solMail=document.getElementById('f-sol-mail').value.trim();
  var depto=document.getElementById('f-depto').value.trim(), equipo=document.getElementById('f-equipo').value.trim();
  var hEst=parseFloat(document.getElementById('f-hest').value)||0;
  var asig=esGestor()?document.getElementById('f-asig').value:'';
  var btn=document.getElementById('new-ok'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    if(S._editId){
      var t=S.tickets.find(function(x){return String(x.id)===String(S._editId);});
      var campos={ Title:asunto, TkDescripcion:desc, TkTipo:tipo, TkPrioridad:prio, TkOrigen:origen, TkSolicitanteNombre:solNom, TkSolicitanteCorreo:solMail, TkDepartamento:depto, TkEquipoProducto:equipo, TkHorasEstimadas:hEst, TkVencimiento:calcVencimiento(t.fSolicitud,prio) };
      if(asig!==t.asignado){ campos.TkAsignado=asig; campos.TkAsignadoNombre=asig?nombreIng(asig):''; if(asig){ campos.TkFechaAsignacion=nowISO(); if(t.estatus==='Nuevo')campos.TkEstatus='Asignado'; } }
      await listUpdate(L_TICKETS,S._editId,campos);
      await listCreate(L_BITACORA,{ Title:'Edición', TkTicketID:String(S._editId), TkTipo:'estatus', TkTexto:'Ticket editado por '+S.user.nombre+'.', TkHoras:0, TkAutorNombre:S.user.nombre, TkAutorCorreo:S.user.email, TkFecha:nowISO() });
      toast('Ticket actualizado');
    } else {
      var folio=await folioNuevo();
      var fSol=nowISO();
      var estatus=asig?'Asignado':'Nuevo';
      var campos2={ Title:asunto, TkFolio:folio, TkDescripcion:desc, TkTipo:tipo, TkPrioridad:prio, TkEstatus:estatus, TkOrigen:origen,
        TkSolicitanteNombre:solNom||S.user.nombre, TkSolicitanteCorreo:solMail||S.user.email, TkDepartamento:depto, TkEquipoProducto:equipo,
        TkAsignado:asig, TkAsignadoNombre:asig?nombreIng(asig):'', TkFechaSolicitud:fSol, TkFechaAsignacion:asig?fSol:'',
        TkHorasEstimadas:hEst, TkHorasReales:0, TkVencimiento:calcVencimiento(fSol,prio) };
      var r=await listCreate(L_TICKETS,campos2);
      if(r.id){ await listCreate(L_BITACORA,{ Title:'Creación', TkTicketID:String(r.id), TkTipo:'estatus', TkTexto:'Ticket creado por '+S.user.nombre+'.', TkHoras:0, TkAutorNombre:S.user.nombre, TkAutorCorreo:S.user.email, TkFecha:fSol }); }
      // notificaciones: a coordinadores y, si se asignó, al ingeniero
      var coords=(S.cfg.coordinadores||[]).slice();
      notif(coords, '[Nuevo ticket] '+folio+' · '+asunto, 'Se registró un nuevo ticket <b>'+esc(folio)+'</b> ('+esc(prio)+'/'+esc(tipo)+').<br>Solicitante: '+esc(solNom||S.user.nombre)+'<br>'+esc(desc), 'nuevo');
      if(asig) notif(asig, '['+folio+'] Se te asignó un ticket', 'Se te asignó el ticket <b>'+esc(folio)+'</b>: "'+esc(asunto)+'".', 'asignacion');
      toast('Ticket creado: '+folio);
    }
    cerrar('m-new'); await loadData();
  }catch(e){ toast('No se pudo guardar'); }
  finally{ btn.disabled=false; btn.textContent=S._editId?'Guardar cambios':'Crear ticket'; }
}

    +'<div class="chips" id="cfg-tipo-chips">'+chipsTipos()+'</div></div>';
  h+='<div class="fld"><label>Objetivos SLA — horas para resolver por prioridad</label><div class="grid2">'
    +['Urgente','Alta','Media','Baja'].map(function(p){ return '<div style="display:flex;align-items:center;gap:8px;"><span style="min-width:70px;font-size:.8rem;color:var(--dim);">'+p+'</span><input class="inp" type="number" min="1" id="cfg-sla-'+p+'" value="'+(c.sla[p]||SLA_DEF[p])+'"><span style="font-size:.76rem;color:var(--dim);">h</span></div>'; }).join('')
    +'</div></div>';
  document.getElementById('cfg-bd').innerHTML=h;
}
function chipsIng(){ return (S.cfg.ingenieros||[]).map(function(x,i){ return '<span class="chipx">'+esc(x.nombre)+' <small style="color:var(--muted);">'+esc(x.correo)+'</small><button onclick="S.cfg.ingenieros.splice('+i+',1);document.getElementById(\'cfg-ing-chips\').innerHTML=chipsIng();">✕</button></span>'; }).join(''); }
function chipsSimple(key){ return (S.cfg[key]||[]).map(function(x,i){ return '<span class="chipx">'+esc(x)+'<button onclick="S.cfg.'+key+'.splice('+i+',1);document.getElementById(\'cfg-'+(key==='coordinadores'?'coord':'dir')+'-chips\').innerHTML=chipsSimple(\''+key+'\');">✕</button></span>'; }).join(''); }
function chipsTipos(){ return (S.cfg.tipos||[]).map(function(x,i){ return '<span class="chipx">'+esc(x)+'<button onclick="S.cfg.tipos.splice('+i+',1);document.getElementById(\'cfg-tipo-chips\').innerHTML=chipsTipos();">✕</button></span>'; }).join(''); }
function cfgAddIng(){ var n=document.getElementById('cfg-ing-nom').value.trim(), m=document.getElementById('cfg-ing-mail').value.trim(); if(!n||!m){ toast('Nombre y correo'); return; } S.cfg.ingenieros.push({nombre:n,correo:m}); document.getElementById('cfg-ing-nom').value=''; document.getElementById('cfg-ing-mail').value=''; document.getElementById('cfg-ing-chips').innerHTML=chipsIng(); }
function cfgAddSimple(key,inpId){ var v=document.getElementById(inpId).value.trim(); if(!v) return; S.cfg[key]=S.cfg[key]||[]; S.cfg[key].push(v); document.getElementById(inpId).value=''; document.getElementById(key==='coordinadores'?'cfg-coord-chips':'cfg-dir-chips').innerHTML=chipsSimple(key); }
function cfgAddTipo(){ var v=document.getElementById('cfg-tipo').value.trim(); if(!v) return; S.cfg.tipos.push(v); document.getElementById('cfg-tipo').value=''; document.getElementById('cfg-tipo-chips').innerHTML=chipsTipos(); }
async function guardarConfig(){
  ['Urgente','Alta','Media','Baja'].forEach(function(p){ var el=document.getElementById('cfg-sla-'+p); if(el) S.cfg.sla[p]=parseInt(el.value,10)||SLA_DEF[p]; });
  async function up(clave,valor){ var body={ Title:clave, TkValor:JSON.stringify(valor) }; if(S.cfgIds[clave]) await listUpdate(L_CONFIG,S.cfgIds[clave],body); else { var r=await listCreate(L_CONFIG,body); if(r.id)S.cfgIds[clave]=r.id; } }
  try{
    await up('ingenieros',S.cfg.ingenieros); await up('coordinadores',S.cfg.coordinadores);
    await up('directores',S.cfg.directores); await up('tipos',S.cfg.tipos); await up('sla',S.cfg.sla);
    cerrar('m-cfg'); S.rol=calcRol(); pintarUsuario(); pintarNav(); render(); toast('Configuración guardada');
  }catch(e){ toast('No se pudo guardar la configuración'); }
}

/* ═══════════════ REPORTES ═══════════════ */
function renderReportes(body){
  var ts=S.tickets.filter(function(t){return t.estatus!=='Cancelado';});
  var abiertos=ts.filter(function(t){return EST_ABIERTO.indexOf(t.estatus)>=0;});
  var cerrados=ts.filter(function(t){return t.estatus==='Resuelto'||t.estatus==='Cerrado';});
  var vencidos=abiertos.filter(function(t){return slaEstado(t)==='vencido';});
  // tiempos
  var trs=cerrados.map(function(t){return diffH(t.fSolicitud,t.fResolucion||t.fCierre);}).filter(function(x){return x!=null;});
  var tpr=ts.map(function(t){return diffH(t.fSolicitud,t.fPrimeraResp);}).filter(function(x){return x!=null;});
  var avgRes=trs.length?(trs.reduce(function(a,b){return a+b;},0)/trs.length):0;
  var avgPR=tpr.length?(tpr.reduce(function(a,b){return a+b;},0)/tpr.length):0;
  var cumplidos=cerrados.filter(function(t){return slaEstado(t)==='cumplido';}).length;
  var pctSla=cerrados.length?Math.round(cumplidos/cerrados.length*100):0;
  var horasTot=ts.reduce(function(a,t){return a+(t.hReal||0);},0);

  var h='<div class="kpi-row">'
    +kpi(ts.length,'Tickets totales','(sin cancelados)')
    +kpi(abiertos.length,'Abiertos', vencidos.length?('<span style="color:#fca5a5;">'+vencidos.length+' vencidos</span>'):'En tiempo')
    +kpi(pctSla+'%','SLA cumplido', cerrados.length+' resueltos')
    +kpi(Math.round(avgRes)+' h','Tiempo prom. resolución','')
    +kpi(Math.round(avgPR)+' h','Prom. 1ª respuesta','')
    +kpi(fmtHoras(horasTot),'Horas invertidas','total registrado')
  +'</div>';

  // carga por ingeniero (abiertos)
  var porIng={};
  (S.cfg.ingenieros||[]).forEach(function(x){ porIng[lc(x.correo)]={nombre:x.nombre,abiertos:0,total:0,horas:0}; });
  ts.forEach(function(t){ var k=lc(t.asignado); if(!k) return; if(!porIng[k]) porIng[k]={nombre:t.asignadoNombre||nombreIng(t.asignado)||k,abiertos:0,total:0,horas:0}; porIng[k].total++; porIng[k].horas+=(t.hReal||0); if(EST_ABIERTO.indexOf(t.estatus)>=0)porIng[k].abiertos++; });
  var arrIng=Object.keys(porIng).map(function(k){return porIng[k];});
  h+='<div class="rep-card"><h4>Carga por ingeniero (tickets abiertos)</h4>'+barras(arrIng.map(function(x){return {l:x.nombre,v:x.abiertos};}),'#f59e0b')+'</div>';

  // horas por ingeniero
  h+='<div class="rep-card"><h4>Horas invertidas por ingeniero</h4>'+barras(arrIng.map(function(x){return {l:x.nombre,v:Math.round(x.horas*10)/10,suf:' h'};}),'#58a6ff')+'</div>';

  // horas por tipo
  var porTipo={}; ts.forEach(function(t){ porTipo[t.tipo]=(porTipo[t.tipo]||0)+(t.hReal||0); });
  h+='<div class="rep-card"><h4>Horas por tipo de soporte</h4>'+barras(Object.keys(porTipo).map(function(k){return {l:k,v:Math.round(porTipo[k]*10)/10,suf:' h'};}),'#a855f7')+'</div>';

  // volumen por origen
  var porOrig={}; ts.forEach(function(t){ porOrig[t.origen]=(porOrig[t.origen]||0)+1; });
  h+='<div class="rep-card"><h4>Volumen por origen</h4>'+barras(Object.keys(porOrig).map(function(k){return {l:k,v:porOrig[k]};}),'#2ea043')+'</div>';

  // volumen por depto/cliente (top 10)
  var porDep={}; ts.forEach(function(t){ var k=t.departamento||'(sin especificar)'; porDep[k]=(porDep[k]||0)+1; });
  var arrDep=Object.keys(porDep).map(function(k){return {l:k,v:porDep[k]};}).sort(function(a,b){return b.v-a.v;}).slice(0,10);
  h+='<div class="rep-card"><h4>Volumen por departamento / cliente (top 10)</h4>'+barras(arrDep,'#1f6feb')+'</div>';

  // tendencia mensual (últimos 6 meses)
  var meses=[]; var now=new Date();
  for(var i=5;i>=0;i--){ var d=new Date(now.getFullYear(),now.getMonth()-i,1); meses.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), lbl:d.toLocaleDateString('es-MX',{month:'short',year:'2-digit'}), nuevos:0, resueltos:0}); }
  function mkey(s){ if(!s)return ''; var d=new Date(s); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  ts.forEach(function(t){ var mk=mkey(t.fSolicitud); var m=meses.find(function(x){return x.k===mk;}); if(m)m.nuevos++; var rk=mkey(t.fResolucion||t.fCierre); var mr=meses.find(function(x){return x.k===rk;}); if(mr && (t.estatus==='Resuelto'||t.estatus==='Cerrado'))mr.resueltos++; });
  h+='<div class="rep-card"><h4>Tendencia mensual</h4><table class="rtab"><tr><th>Mes</th><th>Nuevos</th><th>Resueltos</th></tr>'
    +meses.map(function(m){return '<tr><td>'+esc(m.lbl)+'</td><td>'+m.nuevos+'</td><td>'+m.resueltos+'</td></tr>';}).join('')+'</table></div>';

  body.innerHTML=h;
}
function kpi(v,l,s){ return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }
function barras(arr,color){
  arr=arr.filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
  if(!arr.length) return '<div style="color:var(--muted);font-size:.8rem;">Sin datos.</div>';
  var max=Math.max.apply(null,arr.map(function(x){return x.v;}));
  return arr.map(function(x){ var w=max?Math.round(x.v/max*100):0; return '<div class="bar-row"><span class="bl">'+esc(x.l)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.max(w,4)+'%;background:'+color+'"></span></span><span class="bv">'+x.v+(x.suf||'')+'</span></div>'; }).join('');
}

document.addEventListener('DOMContentLoaded', boot);
boot();
window.abrirTicket=abrirTicket; window.abrirNuevo=abrirNuevo; window.guardarNuevo=guardarNuevo; window.cerrar=cerrar;
window.refrescar=refrescar; window.iniciarCrono=iniciarCrono; window.detenerCrono=detenerCrono; window.registrarHorasManual=registrarHorasManual;
window.tomarTicket=tomarTicket; window.reasignar=reasignar; window.cambiarEstatus=cambiarEstatus; window.reabrir=reabrir; window.cerrarTicket=cerrarTicket;
window.agregarComentario=agregarComentario; window.editarTicket=editarTicket; window.guardarConfig=guardarConfig;
window.cfgAddIng=cfgAddIng; window.cfgAddSimple=cfgAddSimple; window.cfgAddTipo=cfgAddTipo; window.chipsIng=chipsIng; window.chipsSimple=chipsSimple; window.chipsTipos=chipsTipos;
</script>
